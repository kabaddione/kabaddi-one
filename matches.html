<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png" type="image/png">

    <meta name="title" content="Live Matches | KabaddiOne">
    <meta name="description" content="Browse all live kabaddi matches on KabaddiOne. Follow every raid, tackle, and score in real-time. Search by team name, location, or match status.">
    <meta name="keywords" content="live kabaddi matches, kabaddi live score, kabaddi results, live kabaddi streaming, KabaddiOne, kabaddi one live match">
    <meta name="author" content="KabaddiOne">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0a0a1a">
    <link rel="canonical" href="https://kabaddione.com/matches.html">

    <title>Live Matches | KabaddiOne</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        // 🐛 DIAGNOSTIC LOGGING
        window.KABADDI_DEBUG = true;
        window.__kabaddiLog = function(tag, message, data) {
            if (!window.KABADDI_DEBUG) return;
            const styles = { OK: 'color:#22C55E;font-weight:bold', ERR: 'color:#EF4444;font-weight:bold', WARN: 'color:#FBC02D;font-weight:bold', INFO: 'color:#4DD0E1;font-weight:bold' };
            const key = String(tag || 'INFO').toUpperCase();
            console.log('%c[KabaddiOne ' + key + ']', styles[key] || styles.INFO, message, data !== undefined ? data : '');
        };
    </script>

    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #0f0f24;
            --surface-1: #131629;
            --surface-2: #1a1d33;
            --accent: #FF5E3A;
            --accent-glow: #FF3D10;
            --accent-secondary: #FFB830;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c8;
            --text-muted: #7a7a95;
            --border-subtle: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.06);
            --nav-height: 72px;
            --max-width: 1280px;
            --radius-md: 20px;
            --font-heading: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-body: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-lift: 0 20px 50px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.3);
            --shadow-soft: 0 8px 24px rgba(0,0,0,0.35);
            --live-red: #FF3B30;
            --break-amber: #FBC02D;
            --done-gray: #546E7A;
            --paused-blue: #2196F3;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
        body { font-family: var(--font-body); background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }
        a { text-decoration: none; color: inherit; }

        .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .bg-orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: .12; animation: orbFloat 18s ease-in-out infinite; }
        .bg-orb:nth-child(1) { width: 600px; height: 600px; background: var(--accent); top: -15%; left: -10%; }
        .bg-orb:nth-child(2) { width: 450px; height: 450px; background: #6C3CE0; top: 50%; right: -12%; animation-delay: -6s; animation-duration: 20s; }
        @keyframes orbFloat { 0%, 100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(-30px,50px,0) scale(.9); } }

        .nav { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; height: var(--nav-height); background: rgba(10,10,26,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-subtle); }
        .nav-inner { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; display: flex; align-items: center; height: 100%; gap: 12px; }
        .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.4rem; color: #fff; z-index: 1001; }
        .nav-logo img { width: 38px; height: 38px; border-radius: 12px; }
        .nav-links { display: flex; align-items: center; gap: 26px; list-style: none; margin-left: auto; }
        .nav-links a { color: #fff; font-weight: 500; font-size: 0.9rem; transition: .2s; }
        .nav-links a.active { color: var(--accent); }

        .page-wrapper { padding: calc(var(--nav-height) + 32px) 24px 80px; max-width: var(--max-width); margin: 0 auto; width: 100%; position: relative; z-index: 1; flex: 1; }
        .page-hero { text-align: center; margin-bottom: 36px; }
        .page-hero h1 { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 900; margin-bottom: 12px; background: linear-gradient(135deg, #FFFFFF 0%, #FFB830 55%, #FF5E3A 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .hero-stats { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .hero-stat {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
            background: var(--surface-1); border: 2px solid transparent; border-radius: 100px;
            font-size: 13px; font-weight: 700; color: var(--text-secondary); cursor: pointer; transition: 0.2s;
        }
        .hero-stat:hover { border-color: rgba(255,255,255,0.2); color: #fff; }
        .hero-stat.active { background: rgba(255,255,255,0.1); border-color: #fff; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .hero-stat .dot { width: 8px; height: 8px; border-radius: 50%; }
        .hero-stat[data-filter="live"] .dot { background: var(--live-red); box-shadow: 0 0 8px var(--live-red); animation: livePulse 1.5s infinite; }
        .hero-stat[data-filter="break"] .dot { background: var(--break-amber); box-shadow: 0 0 8px var(--break-amber); }
        .hero-stat[data-filter="resulted"] .dot { background: var(--done-gray); }
        .hero-stat[data-filter="all"] .dot { background: var(--accent-secondary); }
        .hero-stat strong { font-size: 15px; }

        @keyframes livePulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }

        .matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-top: 32px; }
        
        .match-card {
            position: relative; background: linear-gradient(165deg, var(--surface-2) 0%, var(--surface-1) 55%, #0f1122 100%);
            border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: 18px;
            cursor: pointer; overflow: hidden; transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .match-card:hover { transform: translateY(-4px); border-color: rgba(255,94,58,0.35); box-shadow: var(--shadow-lift); }
        
        /* Dynamic Status Borders */
        .match-card.live { border-color: rgba(255,59,48,0.28); }
        .match-card.paused { border-color: rgba(33, 150, 243, 0.28); }
        .match-card.early { border-color: rgba(158, 158, 158, 0.28); }

        .match-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; }
        .match-id { font-family: monospace; font-size: 12px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        
        .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 100px; font-size: 10px; font-weight: 900; letter-spacing: 0.8px; text-transform: uppercase; }
        .status-pill.live { background: linear-gradient(135deg, var(--live-red), #B71C1C); color: #fff; box-shadow: 0 4px 12px rgba(255,59,48,0.4); }
        .status-pill.live .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: livePulse 1.5s ease-in-out infinite; }
        .status-pill.break { background: linear-gradient(135deg, var(--break-amber), #F57F17); color: #000; box-shadow: 0 4px 12px rgba(251,192,45,0.3); }
        .status-pill.paused { background: linear-gradient(135deg, var(--paused-blue), #0D47A1); color: #fff; }
        .status-pill.early { background: linear-gradient(135deg, #757575, #424242); color: #fff; }
        .status-pill.resulted { background: linear-gradient(135deg, var(--done-gray), #263238); color: #fff; }

        .match-card-scores { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-bottom: 16px; padding: 12px 0; }
        .team-block { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .team-block.right { justify-content: flex-end; }
        .team-color { width: 6px; height: 42px; border-radius: 3px; flex-shrink: 0; box-shadow: 0 0 12px currentColor; }
        .team-name { font-weight: 800; font-size: 15px; color: #fff; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-width: 0; }
        .team-block.right .team-name { text-align: right; }
        .team-score { font-size: 42px; font-weight: 700; color: #fff; flex-shrink: 0; text-align: center; }
        .vs-badge { font-size: 10px; font-weight: 800; color: var(--text-muted); }

        .winner-line { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; border-radius: 10px; background: rgba(255,184,48,0.08); border: 1px solid rgba(255,184,48,0.2); color: var(--accent-secondary); font-size: 11.5px; font-weight: 800; text-transform: uppercase; margin-bottom: 14px; }
        .match-card-meta { display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border-subtle); font-size: 11.5px; color: var(--text-secondary); font-weight: 600; }

        .loading-state, .empty-state { text-align: center; padding: 60px 24px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="bg-orbs"><div class="bg-orb"></div><div class="bg-orb"></div><div class="bg-orb"></div></div>

    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="nav-logo"><img src="/images/kabaddione_logo.png" alt="Logo"> KabaddiOne</a>
            <ul class="nav-links">
                <li><a href="/matches.html" class="active">Matches</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-wrapper">
        <header class="page-hero">
            <h1>Live Matches</h1>
            <p>Select a match to follow the live raid-by-raid action.</p>
            
            <!-- Clickable Filters -->
            <div class="hero-stats" id="heroStats">
                <div class="hero-stat active" data-filter="live"><span class="dot"></span><strong id="statLive">0</strong> Live</div>
                <div class="hero-stat" data-filter="break"><span class="dot"></span><strong id="statBreak">0</strong> Break / Paused</div>
                <div class="hero-stat" data-filter="resulted"><span class="dot"></span><strong id="statDone">0</strong> Ended</div>
                <div class="hero-stat" data-filter="all"><span class="dot"></span><strong id="statTotal">0</strong> All Matches</div>
            </div>
        </header>

        <div id="loadingState" class="loading-state">Fetching latest data from server...</div>
        <main class="matches-grid" id="matchesGrid"></main>
        <div class="empty-state" id="emptyState" style="display:none;">No matches found for this filter.</div>
    </div>

    <script>
        // 🚨 YOUR CLOUDFLARE WORKER URL
        const WORKER_URL = "https://kabaddione-matches.art-gauravkumar.workers.dev/";
        const LIVE_MATCH_PAGE = '/match/id/index.html?match=';
        
        let allMatches = [];
        let currentFilter = 'live'; // Default filter is LIVE

        const gridEl = document.getElementById('matchesGrid');
        const loadingEl = document.getElementById('loadingState');
        const emptyEl = document.getElementById('emptyState');

        // Setup Filter Click Listeners
        document.querySelectorAll('.hero-stat').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.hero-stat').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        // Smart Status Interpreter
        function determineMatchStatus(matchData) {
            const statusStr = String(matchData.half_status || '').toLowerCase();
            const resultStr = String(matchData.match_result || '').trim();
            const breakTitle = String(matchData.break_clock_title || '').trim();

            if (resultStr) return 'resulted';
            if (statusStr.includes('ended early')) return 'early';
            if (statusStr.includes('paused')) return 'paused';
            if (statusStr.includes('over') || statusStr.includes('full time')) return 'resulted';
            if (breakTitle) return 'break';

            return 'live';
        }

        // Fetch loop
        async function fetchMatches() {
            try {
                const response = await fetch(WORKER_URL);
                const data = await response.json();
                
                if (data) {
                    allMatches = Object.entries(data).map(([id, value]) => ({
                        id,
                        data: value || {},
                        status: determineMatchStatus(value || {})
                    }));
                } else {
                    allMatches = [];
                }
                
                loadingEl.style.display = 'none';
                updateCounts();
                render();
            } catch (error) {
                window.__kabaddiLog('ERR', 'Fetch failed', error);
            }
        }

        function updateCounts() {
            document.getElementById('statLive').textContent = allMatches.filter(m => m.status === 'live').length;
            document.getElementById('statBreak').textContent = allMatches.filter(m => m.status === 'break' || m.status === 'paused').length;
            document.getElementById('statDone').textContent = allMatches.filter(m => m.status === 'resulted' || m.status === 'early').length;
            document.getElementById('statTotal').textContent = allMatches.length;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function render() {
            // Apply current filter
            const filtered = allMatches.filter(m => {
                if (currentFilter === 'all') return true;
                if (currentFilter === 'break') return m.status === 'break' || m.status === 'paused';
                if (currentFilter === 'resulted') return m.status === 'resulted' || m.status === 'early';
                return m.status === currentFilter; // 'live'
            });

            // Sort by most recently updated
            filtered.sort((a, b) => (Number(b.data.last_updated) || 0) - (Number(a.data.last_updated) || 0));

            if (filtered.length === 0) {
                gridEl.style.display = 'none';
                emptyEl.style.display = 'block';
                return;
            }

            emptyEl.style.display = 'none';
            gridEl.style.display = 'grid';

            gridEl.innerHTML = filtered.map(m => {
                const d = m.data;
                let pillHtml = '';
                
                if (m.status === 'live') {
                    pillHtml = '<span class="status-pill live"><span class="dot"></span> Live</span>';
                } else if (m.status === 'break') {
                    pillHtml = `<span class="status-pill break"><i class="fa-solid fa-mug-hot"></i> ${escapeHtml(d.break_clock_title || 'Break')}</span>`;
                } else if (m.status === 'paused') {
                    pillHtml = '<span class="status-pill paused"><i class="fa-solid fa-pause"></i> Paused</span>';
                } else if (m.status === 'early') {
                    pillHtml = '<span class="status-pill early"><i class="fa-solid fa-circle-stop"></i> Ended Early</span>';
                } else {
                    pillHtml = '<span class="status-pill resulted"><i class="fa-solid fa-flag-checkered"></i> Match Over</span>';
                }

                let winnerBlock = '';
                if (m.status === 'resulted' && d.match_result) {
                    winnerBlock = `<div class="winner-line"><i class="fa-solid fa-trophy"></i> ${escapeHtml(d.match_result)}</div>`;
                }

                return `
                <article class="match-card ${m.status}" onclick="window.location.href='${LIVE_MATCH_PAGE}${m.id}'">
                    <div class="match-card-top">
                        <span class="match-id">#${m.id.toUpperCase()}</span>
                        ${pillHtml}
                    </div>
                    
                    <div class="match-card-scores">
                        <div class="team-block">
                            <div class="team-color" style="background:${d.left_color || '#4CAF50'}"></div>
                            <div class="team-name">${escapeHtml(d.left_name || 'Team A')}</div>
                            <div class="team-score">${d.left_score || 0}</div>
                        </div>
                        <div class="vs-badge">VS</div>
                        <div class="team-block right">
                            <div class="team-score">${d.right_score || 0}</div>
                            <div class="team-name">${escapeHtml(d.right_name || 'Team B')}</div>
                            <div class="team-color" style="background:${d.right_color || '#2196F3'}"></div>
                        </div>
                    </div>
                    
                    ${winnerBlock}
                    
                    <div class="match-card-meta">
                        <span><i class="fa-solid fa-location-dot"></i> ${escapeHtml(d.match_location || 'Arena')}</span>
                        <span><i class="fa-regular fa-clock"></i> ${escapeHtml(d.half_status || 'Live')}</span>
                    </div>
                </article>`;
            }).join('');
        }

        // Fetch immediately, then every 12 seconds
        fetchMatches();
        setInterval(fetchMatches, 12000);
    </script>
</body>
</html>
