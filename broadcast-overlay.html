<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KabaddiOne Professional Broadcast Overlay</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Teko:wght@600;700&family=Mukta:wght@700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        /* =========================================
           OBS TRANSPARENT CANVAS RESET
           ========================================= */
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background: transparent !important;
            overflow: hidden;
            font-family: 'Oswald', sans-serif;
        }

        .broadcast-stage {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 1920px;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0px 15px 25px rgba(0,0,0,0.9)); 
        }

        .gold-bg {
            background: linear-gradient(to bottom, #FFF3A3 0%, #D4AF37 40%, #AA7700 60%, #FFD700 100%);
        }

        /* =========================================
           LOGO BAR
           ========================================= */
        .logo-bar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 40px;
            padding: 0 30px;
            background: linear-gradient(to bottom, rgba(20,20,40,0.95), rgba(0,0,0,0.9));
            border: 2px solid rgb(253, 241, 159);
            border-radius: 0px;
            margin-bottom: -13px;
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 11px;
            letter-spacing: 1.2px;
            font-weight: 600;
            z-index: 6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,215,0,0.15);
            clip-path: polygon(10% 0,90% 0, 100% 100%, 0 100%);
        }
        .logo-bar .logo-powered { color: rgb(185, 185, 185); font-size: 12px; letter-spacing: 1.1px; font-weight: 600; }
        .logo-bar .logo-icon {
            width: 28px; height: 28px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            box-shadow: 0 0 20px rgba(255,215,0,0.4);
            animation: logoPulse 3s ease-in-out infinite;
        }
        .logo-bar .logo-text { color: #FFF; font-weight: 700; font-size: 17px; letter-spacing: 0.7px; text-shadow: 0 0 8px rgba(255,215,0,0.4); }
        .logo-bar .logo-icon img { width: 100%; height: 100%; object-fit: contain; }

        /* =========================================
           TOP LAYER: RAID PROGRESS BARS
           ========================================= */
        .top-raid-bars {
            display: flex;
            justify-content: space-between;
            width: 1080px;
            margin-bottom: -3px;
            z-index: 5;
        }

        .raid-track {
            width: 418px;
            height: 14px;
            background: rgba(0,0,0,0.8);
            display: flex;
            overflow: hidden;
            visibility: hidden;
            opacity: 0;
            border: 2px solid #D4AF37;
            border-bottom: none;
            transition: opacity 0.35s ease, visibility 0.35s ease, box-shadow 0.4s ease;
        }
        .raid-track.visible {
            visibility: visible;
            opacity: 1;
        }
        /* Glow applied per team colour (matches --raid-bar-color) */
        .raid-track.visible {
            box-shadow: 0 0 14px var(--raid-bar-color, #00FF00),
                        0 0 6px var(--raid-bar-color, #00FF00),
                        inset 0 0 8px rgba(0,0,0,0.6);
        }

        .track-left { justify-content: flex-end; border-top-left-radius: 0px; margin-left: -87px;
clip-path: polygon(0 0, 98% 0, 100% 100%, 2% 100%); }
        .track-right { justify-content: flex-start; border-top-right-radius: 0px; clip-path: polygon(2% 0, 100% 0, 98% 100%, 0 100%);
margin-right: -87px;}

        .raid-fill {
            height: 100%;
            width: 100%;
            background: var(--raid-bar-color, #00FF00);
            box-shadow: 0px 0px 15px var(--raid-bar-color, #00FF00);
            transition: width 1s linear;
        }
        /* NOTE: `.danger` class no longer applied — bar keeps team colour entire raid */

        /* =========================================
           DO-OR-DIE BANNER
           ========================================= */
        .dod-banner {
            position: absolute;
            bottom: calc(100% + 20px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 8px 32px;
            font-family: 'Oswald', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #FFFFFF;
            background: linear-gradient(to bottom, #D32F2F, #8B0000);
            border: 3px solid #FFD700;
            border-radius: 6px;
            text-shadow: 0 0 12px rgba(255,0,0,0.9), 2px 2px 4px rgba(0,0,0,0.8);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.7), 0 8px 20px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(15px) scale(0.9);
            transition: opacity 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 20;
        }
        .dod-banner.show { opacity: 1; transform: translateY(0) scale(1); animation: dodSiren 1s infinite alternate; }
        .dod-banner.dod-left  { left: 200px; }
        .dod-banner.dod-right { right: 200px; }
        .dod-banner .siren-icon { font-size: 30px; filter: drop-shadow(0 0 8px #FF0000); animation: sirenRotate 0.6s infinite alternate; display: inline-block; }
        @keyframes dodSiren {
            from { box-shadow: 0 0 15px rgba(255,0,0,0.5), 0 8px 20px rgba(0,0,0,0.6); }
            to   { box-shadow: 0 0 40px rgba(255,0,0,1), 0 8px 20px rgba(0,0,0,0.6); }
        }
        @keyframes sirenRotate { from { transform: scale(1); } to { transform: scale(1.15); } }

        /* =========================================
           SIDE BANNER
           ========================================= */
        .side-banner {
            position: absolute;
            bottom: calc(100% + 20px);
            background: linear-gradient(to top, #1A0033, #4A148C);
            border: 3px solid #D4AF37;
            padding: 6px 30px;
            font-size: 20px;
            color: rgb(255, 215, 3);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.45s cubic-bezier(0.34, 1.2, 0.64, 1),
                        transform 0.45s cubic-bezier(0.34, 1.2, 0.64, 1);
            box-shadow: 0px 10px 25px rgba(0,0,0,0.85);
            z-index: 25;
            white-space: nowrap;
            height: 55px;
            max-width: 700px;
        }
        .side-banner.show { opacity: 1; transform: translateY(0) scale(1); }
        .side-banner.pos-right { right: 265px; left: auto; clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%); padding-left: 40px; }
        .side-banner.pos-left { left: 265px; right: auto; clip-path: polygon(0 0, 94% 0, 100% 100%, 6% 100%); padding-right: 40px; flex-direction: row-reverse; }
        .side-banner.foul { background: linear-gradient(to right, #4A0000, #D32F2F); border-color: #FFD700; color: #FFD700; }
        .side-banner.foul .side-banner-detail { color: #FFFFFF; }
        .side-banner .side-banner-label { font-family: 'Oswald', sans-serif; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .side-banner .side-banner-detail { color: #FFFFFF; }

        /* =========================================
           MAIN SCOREBOARD ROW
           ========================================= */
        .main-row {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            z-index: 10;
            height: 85px;
        }

        .team-left-wrap {
            width: 460px; height: 80px;
            clip-path: polygon(0 0, 90% 0, 100% 100%, 10% 100%);
            padding: 4px; padding-right: 5px;
            z-index: 1;
            transition: filter 0.4s ease;
        }
        .team-left-wrap.dod-active { filter: drop-shadow(0 0 20px #FF0000) drop-shadow(0 0 40px #FF0000); }
        .team-left-inner {
            width: 100%; height: 100%;
            clip-path: polygon(0 0, 90% 0, 100% 100%, 10% 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-family: 'Mukta', sans-serif; font-size: 40px; font-weight: 800; text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            box-shadow: inset 0px 20px 20px rgba(255,255,255,0.2), inset 0px -20px 20px rgba(0,0,0,0.5);
            transition: background 0.5s ease, box-shadow 0.5s ease;
            position: relative;
        }
        .team-left-inner.dod-active {
            background: linear-gradient(to right, #4A0000, #D32F2F) !important;
            animation: dodBarPulse 1s infinite alternate;
        }
        @keyframes dodBarPulse {
            from { box-shadow: inset 0px 20px 20px rgba(255,255,255,0.2), inset 0px -20px 20px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,0,0,0.4); }
            to   { box-shadow: inset 0px 20px 20px rgba(255,255,255,0.2), inset 0px -20px 20px rgba(0,0,0,0.5), inset 0 0 50px rgba(255,0,0,0.9); }
        }

        /* Name / Raider name rotator */
        .name-rotator {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .team-name-text, .raider-name-text {
            position: absolute;
            width: 100%;
            text-align: center;
            transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            will-change: transform, opacity;
        }
        .team-name-text { transform: translateY(0); opacity: 1; }
        .team-name-text.out { transform: translateY(-130%); opacity: 0; }
        .raider-name-text {
            transform: translateY(130%);
            opacity: 0;
            color: #FFF;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.95);
            font-weight: 900;
        }
        .raider-name-text.show { transform: translateY(0); opacity: 1; }
        .raider-name-text.out { transform: translateY(-130%); opacity: 0; }

        .score-left-wrap {
            width: 180px; height: 85px;
            clip-path: polygon(0 0, 72% 0, 100% 100%, 28% 100%);
            margin-left: -40px;
            z-index: 2;
            padding: 5px;
        }
        .score-left-inner {
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, #FFFFFF, #D0D0D0);
            clip-path: polygon(0 0, 72% 0, 100% 100%, 28% 100%);
            display: flex; align-items: center; justify-content: center;
            color: black; font-family: 'Teko', sans-serif; font-size: 75px; font-weight: 700; padding-left: 15px; padding-top: 10px;
            box-shadow: inset 0px 10px 15px rgba(0,0,0,0.2);
        }

        /* =========================================
           CENTER RAID CLOCK TRIANGLE (with splash logo swap)
           ========================================= */
        .center-wrap {
            width: 140px; height: 105px;
            clip-path: polygon(0% 0%, 100% 0%, 65% 80%, 35% 80%);
            margin: 0 -45px;
            z-index: 3;
            padding: 5px;
        }
        .center-inner {
            position: relative;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, #6A1B9A, #1A0033);
            clip-path: polygon(0% 0%, 100% 0%, 65% 80%, 35% 80%);
            overflow: hidden;
        }
        /* Both items are absolutely positioned and slide on Y axis */
        #raid-timer {
            position: absolute;
            top: 15px; left: 0; right: 0;
            text-align: center;
            color: #FFD700;
            font-family: 'Teko', sans-serif;
            font-size: 45px;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 0 15px rgba(255,215,0,0.4);
            transform: translateY(0);
            opacity: 1;
            transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            will-change: transform, opacity;
        }
        #raid-timer.out { transform: translateY(-140%); opacity: 0; }

        #splash-logo {
            position: absolute;
            top: 38%; left: 50%;
            width: 78%;
            max-height: 55px;
            height: auto;
            object-fit: contain;
            transform: translate(-50%, calc(-50% + 140%));
            opacity: 0;
            transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            will-change: transform, opacity;
            pointer-events: none;
        }
        #splash-logo.show { transform: translate(-50%, -50%); opacity: 1; }
        #splash-logo.out  { transform: translate(-50%, calc(-50% - 140%)); opacity: 0; }

        .score-right-wrap {
            width: 180px; height: 85px;
            clip-path: polygon(28% 0, 100% 0, 72% 100%, 0 100%);
            margin-left: 0px;
            z-index: 2;
            padding: 5px;
        }
        .score-right-inner {
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, #FFFFFF, #D0D0D0);
            clip-path: polygon(28% 0, 100% 0, 72% 100%, 0 100%);
            display: flex; align-items: center; justify-content: center;
            color: black; font-family: 'Teko', sans-serif; font-size: 75px; font-weight: 700; padding-right: 15px; padding-top: 10px;
            box-shadow: inset 0px 10px 15px rgba(0,0,0,0.2);
        }

        .team-right-wrap {
            width: 460px; height: 80px;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            margin-left: -40px;
            z-index: 1;
            padding: 4px; padding-left: 5px;
            transition: filter 0.4s ease;
        }
        .team-right-wrap.dod-active { filter: drop-shadow(0 0 20px #FF0000) drop-shadow(0 0 40px #FF0000); }
        .team-right-inner {
            width: 100%; height: 100%;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-family: 'Mukta', sans-serif; font-size: 40px; font-weight: 800; text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            box-shadow: inset 0px 20px 20px rgba(255,255,255,0.2), inset 0px -20px 20px rgba(0,0,0,0.5);
            transition: background 0.5s ease, box-shadow 0.5s ease;
        }
        .team-right-inner.dod-active {
            background: linear-gradient(to left, #4A0000, #D32F2F) !important;
            animation: dodBarPulse 1s infinite alternate;
        }

        /* =========================================
           BOTTOM ROW
           ========================================= */
        .bottom-row {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
            margin-top: -12px;
            z-index: 0;
        }

        .dots-left-wrap {
            width: 310px; height: 38px;
            clip-path: polygon(0 0, 93% 0, 100% 100%, 7% 100%);
            padding: 4px; padding-top: 0px; margin-right: 0px;
        }
        .dots-left-inner {
            width: 100%; height: 100%;
            clip-path: polygon(0 0, 94% 0, 100% 100%, 6% 100%);
            display: flex; align-items: center; justify-content: flex-end;
            padding-right: 45px; gap: 10px;padding-top: 5px;
        }

        .center-info-wrap {
            width: 500px; height: 45px;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
            padding: 4px; padding-top: 0px; z-index: 4; margin-top: 8px;
        }

        .center-info-inner {
            position: relative;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, #6A1B9A, #1A0033);
            clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 45px;
            color: white; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            font-size: 15px;
            transition: background 0.4s ease;
        }
        .info-box { display: flex; align-items: center; justify-content: center; height: 26px; padding: 0 14px; white-space: nowrap; color: #FFFFFF; }
        .info-box-left  { justify-self: flex-start; }
        .info-box-right { justify-self: flex-end; }
        .info-box-center {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            height: 23px; padding: 0 18px;
            border-left: 3px solid #888;
            border-right: 3px solid #888;
            border-radius: 0px; z-index: 2;
        }
        .info-box-center .gold-text { color: #FFD700; font-family: 'Teko', sans-serif; font-size: 30px; line-height: 1; margin-top: 6px; }

        .center-info-inner.break-mode { background: linear-gradient(to bottom, #F57F17, #E65100); }
        .center-info-inner.final-mode { background: linear-gradient(to bottom, #37474F, #212121); }

        .dots-right-wrap {
            width: 310px; height: 38px;
            clip-path: polygon(7% 0, 100% 0, 93% 100%, 0 100%);
            padding: 4px; padding-top: 0px; margin-left: 0px;
        }
        .dots-right-inner {
            width: 100%; height: 100%;
            clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
            display: flex; align-items: center; justify-content: flex-start;
            padding-left: 45px; gap: 10px;padding-top: 5px;
        }

        .dot {
            width: 16px; height: 16px;
            border-radius: 50%;
            border: 2px solid #D4AF37;
            background: rgba(255,255,255,0.2);
            box-shadow: 0px 2px 4px rgba(0,0,0,0.8);
            transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        }
        .dot.active {
            background: var(--dot-active-color, #00FF00);
            border-color: #FFFFFF;
            box-shadow: 0 0 10px var(--dot-active-color, #00FF00),
                        0 0 4px #FFFFFF inset;
        }

        /* =========================================
           CENTER EVENT POPUP (small one, kept for fallback)
           ========================================= */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #FFD700; text-shadow: 0px 0px 20px #FFD700; }
            100% { transform: scale(1); }
        }
        .score-pop { animation: pop 0.6s ease-in-out; }

        .center-popup {
            position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            background: linear-gradient(to bottom, #D32F2F, #8B0000);
            border: 5px solid #FFD700; border-radius: 15px;
            padding: 20px 100px; color: white; font-family: 'Teko', sans-serif; font-size: 90px; font-weight: 700; letter-spacing: 6px;
            box-shadow: 0px 0px 50px rgba(255, 215, 0, 0.8);
            opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap; text-transform: uppercase;
            z-index: 200;
        }
        .center-popup.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* =========================================
           FULL-SCREEN EPIC EVENT OVERLAY
           (Super Raid / Super Tackle / All Out)
           ========================================= */
        .epic-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            overflow: hidden;
        }
        .epic-overlay.visible { visibility: visible; }

        .epic-bg {
            position: absolute;
            inset: 0;
            background: url('/images/kabaddione_bg.jpg') center/cover no-repeat;
            opacity: 0;
            z-index: 1;
        }
        .epic-vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 2;
            opacity: 0;
        }

        .epic-horizontal-bar {
            position: absolute;
            top: 50%;
            left: 5%;
            width: 90%;
            height: 6px;
            background: linear-gradient(90deg, transparent 0%, #FFD700 25%, #FFFFFF 50%, #FFD700 75%, transparent 100%);
            box-shadow: 0 0 30px #FFD700, 0 0 60px #FFD700;
            transform: scaleX(0);
            transform-origin: center;
            z-index: 3;
            border-radius: 3px;
        }

        .epic-main-container {
            position: relative;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transform: scale(15);
            opacity: 0;
            will-change: transform, opacity;
        }

        .epic-text {
            font-family: 'Teko', sans-serif;
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: 12px;
            text-align: center;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #FFFFFF 0%, #ABABAB 50%, #FFFFFF 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.95)) drop-shadow(0 0 20px rgba(255,215,0,0.6));
        }
        .epic-text-super { font-size: 110px; letter-spacing: 18px; }
        .epic-text-event { font-size: 200px; letter-spacing: 20px; font-weight: 900; }

        /* Entry phase */
        .epic-overlay.entry .epic-bg { animation: epicBgFadeIn 0.35s ease-out forwards; }
        .epic-overlay.entry .epic-vignette { animation: epicBgFadeIn 0.35s ease-out forwards; }
        .epic-overlay.entry .epic-horizontal-bar { animation: epicHBar 0.4s cubic-bezier(0.34, 1.4, 0.64, 1) forwards; }
        .epic-overlay.entry .epic-main-container {
            animation: epicContainerEntry 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Hold phase */
        .epic-overlay.hold .epic-main-container {
            animation: epicHold 1.2s linear forwards;
        }

        /* Exit phase */
        .epic-overlay.exit .epic-bg { animation: epicBgFadeOut 0.4s ease forwards; }
        .epic-overlay.exit .epic-vignette { animation: epicBgFadeOut 0.4s ease forwards; }
        .epic-overlay.exit .epic-main-container {
            animation: epicContainerExit 0.4s cubic-bezier(0.5, 0, 0.7, 1.5) forwards;
        }

        @keyframes epicBgFadeIn  { from { opacity: 0; } to { opacity: 1; } }
        @keyframes epicBgFadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes epicHBar {
            from { transform: scaleX(0); }
            to   { transform: scaleX(1); }
        }
        @keyframes epicContainerEntry {
            0%   { transform: scale(15); opacity: 0; }
            55%  { transform: scale(1.12); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes epicHold {
            from { transform: scale(1); }
            to   { transform: scale(1.05); }
        }
        @keyframes epicContainerExit {
            0%   { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(25); opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- FULL-SCREEN EPIC EVENT OVERLAY -->
    <div id="epic-overlay" class="epic-overlay">
        <div class="epic-bg"></div>
        <div class="epic-vignette"></div>
        <div class="epic-horizontal-bar"></div>
        <div class="epic-main-container">
            <div id="epic-super-text" class="epic-text epic-text-super">SUPER</div>
            <div id="epic-event-text" class="epic-text epic-text-event">TACKLE</div>
        </div>
    </div>

    <script>
        // ==========================================
        // FIREBASE INIT
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://kabaddi-scoreboard-e1522-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('match');

        if (!matchId) {
            document.getElementById('left-name').innerText = "NO MATCH ID";
            document.getElementById('right-name').innerText = "LINK URL ERROR";
        } else {
            document.getElementById('match-id').innerText = matchId.toUpperCase();
            initBroadcastEngine(matchId);
        }

        // ==========================================
        // STATE
        // ==========================================
        let previousLeftScore = -1;
        let previousRightScore = -1;
        let previousLogId = null;
        let previousAllOut = false;
        let previousSuperTackle = false;
        let previousRaidPoint = false;

        let isSwapped = false;
        let lastLeftColor = null;
        let lastRightColor = null;

        // Raid clock visual state (null = first snapshot)
        let previousRaidActive = null;

        // Raider name rotation state
        const raiderRotationState = {
            left:  { active: false, timer: null, currentRaider: null },
            right: { active: false, timer: null, currentRaider: null }
        };

        // ==========================================
        // UTILITIES
        // ==========================================
        function darkenColor(color, percent) {
            if (!color || color.length < 7) return color || "#000000";
            let R = parseInt(color.substring(1,3),16);
            let G = parseInt(color.substring(3,5),16);
            let B = parseInt(color.substring(5,7),16);
            R = Math.min(255, Math.max(0, parseInt(R * (100 - percent) / 100)));
            G = Math.min(255, Math.max(0, parseInt(G * (100 - percent) / 100)));
            B = Math.min(255, Math.max(0, parseInt(B * (100 - percent) / 100)));
            const hex = n => (n.toString(16).length==1) ? "0"+n.toString(16) : n.toString(16);
            return "#"+hex(R)+hex(G)+hex(B);
        }

        function splitConcatenatedIds(blob, roster){
            if(!blob || !roster || !roster.length) return [];
            const ids = roster.map(p => String(p.id||'')).filter(Boolean).sort((a,b)=>b.length-a.length);
            const out = []; let i = 0;
            while(i < blob.length){
                let matched = null;
                for(const id of ids){ if(blob.startsWith(id, i)){ matched = id; break; } }
                if(matched){ out.push(matched); i += matched.length; }
                else { i++; }
            }
            return out;
        }

        // ==========================================
        // ENGINE
        // ==========================================
        function initBroadcastEngine(id) {
            const matchRef = db.ref('live_matches/' + id);

            matchRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // ── 1. HALF-TIME SWAP DETECTION ──
                const halfStr = (data.half_status || '').toLowerCase();
                isSwapped = halfStr.includes('2nd') || halfStr.includes('second') || halfStr.includes('final');

                const visualLeftKey  = isSwapped ? 'right' : 'left';
                const visualRightKey = isSwapped ? 'left'  : 'right';

                // ── 2. NAMES & COLOURS ──
                const leftName  = data[visualLeftKey  + '_name']  || "TEAM A";
                const rightName = data[visualRightKey + '_name'] || "TEAM B";
                const leftColor  = data[visualLeftKey  + '_color'] || "#009900";
                const rightColor = data[visualRightKey + '_color'] || "#0055ff";

                document.getElementById('left-name').innerText  = leftName;
                document.getElementById('right-name').innerText = rightName;

                if (lastLeftColor !== leftColor) {
                    document.getElementById('left-team-bg').style.background =
                        `linear-gradient(to right, ${darkenColor(leftColor, 60)}, ${leftColor})`;
                    document.getElementById('left-dots-bg').style.background = darkenColor(leftColor, 80);
                    lastLeftColor = leftColor;
                }
                if (lastRightColor !== rightColor) {
                    document.getElementById('right-team-bg').style.background =
                        `linear-gradient(to left, ${darkenColor(rightColor, 60)}, ${rightColor})`;
                    document.getElementById('right-dots-bg').style.background = darkenColor(rightColor, 80);
                    lastRightColor = rightColor;
                }

                // ── 3. SCORES ──
                const leftScore  = data[visualLeftKey  + '_score'] || 0;
                const rightScore = data[visualRightKey + '_score'] || 0;
                updateScoreWithAnimation('left-score',  leftScore,  previousLeftScore);
                updateScoreWithAnimation('right-score', rightScore, previousRightScore);
                previousLeftScore  = leftScore;
                previousRightScore = rightScore;

                // ── 4. CENTER CLOCK & STATUS ──
                applyCenterClockAndStatus(data);

                // ── 5. STATE JSON ──
                if (data.state_json) {
                    try {
                        const state = JSON.parse(data.state_json);

                        renderDots('left-dot',
                            state[visualLeftKey  + 'OutIds'],
                            state[visualLeftKey  + 'RosterJson'],
                            leftColor);
                        renderDots('right-dot',
                            state[visualRightKey + 'OutIds'],
                            state[visualRightKey + 'RosterJson'],
                            rightColor);

                        handleRaidTimers(state, data.raid_clock, visualLeftKey, leftColor, rightColor);
                        handleDoOrDie(state, visualLeftKey, visualRightKey, data.raid_clock);

                        // Raider name rotation (integrates with raid clock active detection)
                        handleRaiderNameRotation(state, data, visualLeftKey, leftColor, rightColor);

                        handleEventTimeline(state);

                    } catch (e) {
                        console.warn("State JSON parse error", e);
                    }
                }
            });
        }

        // ==========================================
        // CENTER CLOCK & STATUS
        // ==========================================
        function applyCenterClockAndStatus(data) {
            const timerEl   = document.getElementById('main-timer');
            const statusEl  = document.getElementById('half-status');
            const infoInner = document.getElementById('center-info-inner');

            const breakTitle = (data.break_clock_title || '').trim();
            const breakTime  = (data.break_clock_time  || '').trim();
            const hasBreak   = breakTitle.length > 0 && breakTime.length > 0 && breakTime !== '00:00';
            const matchOver  = !!data.match_result
                || (data.half_status || '').toLowerCase().includes('over')
                || (data.half_status || '').toLowerCase().includes('full time');

            infoInner.classList.remove('break-mode', 'final-mode');

            if (matchOver) {
                statusEl.innerText = "FULL TIME";
                timerEl.innerText  = "00:00";
                infoInner.classList.add('final-mode');
            } else if (hasBreak) {
                statusEl.innerText = breakTitle.toUpperCase();
                timerEl.innerText  = breakTime;
                infoInner.classList.add('break-mode');
            } else {
                statusEl.innerText = data.half_status || "1st HALF";
                timerEl.innerText  = data.main_clock  || "00:00";
            }
        }

        // ==========================================
        // SCORE POP
        // ==========================================
        function updateScoreWithAnimation(elementId, newScore, oldScore) {
            const el = document.getElementById(elementId);
            if (oldScore !== -1 && newScore > oldScore) {
                el.innerText = newScore;
                el.classList.remove('score-pop');
                void el.offsetWidth;
                el.classList.add('score-pop');
            } else {
                el.innerText = newScore;
            }
        }

        // ==========================================
        // DOTS RENDERER
        // ==========================================
        function renderDots(dotClassName, outIdsStr, rosterJsonStr, teamColor) {
            const dots = document.getElementsByClassName(dotClassName);
            if (!dots.length) return;

            for (let i = 0; i < dots.length; i++) {
                dots[i].style.setProperty('--dot-active-color', teamColor);
            }

            let roster = [];
            try { roster = JSON.parse(rosterJsonStr || '[]'); } catch(e) { roster = []; }
            const pJ = j => { const n = parseInt(j); return isNaN(n) ? 999 : n; };
            const starting7 = roster
                .filter(p => p.isStarting7)
                .sort((a,b) => pJ(a.jerseyNumber) - pJ(b.jerseyNumber));

            if (starting7.length === 0) return;

            const outOrder = splitConcatenatedIds(outIdsStr || '', starting7);
            const outSet   = new Set(outOrder);
            const alive    = starting7.filter(p => !outSet.has(p.id));
            const outP     = outOrder.map(id => starting7.find(p => p.id === id)).filter(Boolean);

            const isLeft = (dotClassName === 'left-dot');
            let items;
            if (isLeft) {
                items = [
                    ...[...alive].reverse().map(p => ({ alive: true,  id: p.id })),
                    ...outP.map(p => ({ alive: false, id: p.id }))
                ];
            } else {
                items = [
                    ...[...outP].reverse().map(p => ({ alive: false, id: p.id })),
                    ...alive.map(p => ({ alive: true, id: p.id }))
                ];
            }
            while (items.length < 7) items.push({ alive: false, id: null });

            for (let i = 0; i < dots.length && i < 7; i++) {
                dots[i].classList.toggle('active', !!items[i].alive);
            }
        }

        // ==========================================
        // RAID TIMER BARS
        //   • Applies team colour to bar + track glow
        //   • No red danger state — colour stays constant entire raid
        // ==========================================
        function handleRaidTimers(state, raidClockStr, visualLeftKey, leftColor, rightColor) {
            const raidTimerText = document.getElementById('raid-timer');
            const trackLeft  = document.getElementById('raid-track-left');
            const trackRight = document.getElementById('raid-track-right');
            const barLeft    = document.getElementById('raid-bar-left');
            const barRight   = document.getElementById('raid-bar-right');

            // Apply team colours to bar AND track (for glow)
            barLeft.style.setProperty('--raid-bar-color',  leftColor);
            barRight.style.setProperty('--raid-bar-color', rightColor);
            trackLeft.style.setProperty('--raid-bar-color',  leftColor);
            trackRight.style.setProperty('--raid-bar-color', rightColor);

            const timeInt = parseInt(raidClockStr);
            const displayTime = isNaN(timeInt) ? 30 : timeInt;
            raidTimerText.innerText = displayTime;

            const raidActive = state.raidTimerRunning === true
                || (!isNaN(timeInt) && timeInt > 0 && timeInt < 30);

            // Swap raid clock <-> splash logo when paused/running
            updateRaidClockVisual(raidActive);

            if (raidActive) {
                let actualLeftRaid = true;
                const raw = state.currentRaidTeamIsLeft !== undefined
                    ? state.currentRaidTeamIsLeft
                    : state.currentRaidTeamsLeft;
                if (raw === true  || raw === 1 || raw === '1' || raw === 'true')  actualLeftRaid = true;
                else if (raw === false || raw === 0 || raw === '0' || raw === 'false') actualLeftRaid = false;

                const visualLeftRaid = (visualLeftKey === 'left') ? actualLeftRaid : !actualLeftRaid;

                if (visualLeftRaid) {
                    trackLeft.classList.add('visible');
                    trackRight.classList.remove('visible');
                } else {
                    trackRight.classList.add('visible');
                    trackLeft.classList.remove('visible');
                }

                const percentage = Math.max(0, Math.min(100, (displayTime / 30) * 100));
                barLeft.style.width  = percentage + "%";
                barRight.style.width = percentage + "%";

                // NOTE: .danger class intentionally NOT applied
                barLeft.classList.remove('danger');
                barRight.classList.remove('danger');
            } else {
                trackLeft.classList.remove('visible');
                trackRight.classList.remove('visible');
                barLeft.style.width  = "100%";
                barRight.style.width = "100%";
                barLeft.classList.remove('danger');
                barRight.classList.remove('danger');
            }
        }

        // ==========================================
        // RAID CLOCK ↔ SPLASH LOGO SWAP
        //   Paused  → 30 hidden, splash logo slides up
        //   Running → splash logo slides out top, 30 shows
        // ==========================================
        function updateRaidClockVisual(isRaidActive) {
            // Skip on very first snapshot if state matches default
            if (previousRaidActive === null) {
                previousRaidActive = isRaidActive;
                const timerEl = document.getElementById('raid-timer');
                const logoEl  = document.getElementById('splash-logo');
                if (isRaidActive) {
                    logoEl.classList.remove('show');
                    logoEl.classList.remove('out');
                    timerEl.classList.remove('out');
                } else {
                    timerEl.classList.add('out');
                    logoEl.classList.remove('out');
                    logoEl.classList.add('show');
                }
                return;
            }
            if (isRaidActive === previousRaidActive) return;
            previousRaidActive = isRaidActive;

            const timerEl = document.getElementById('raid-timer');
            const logoEl  = document.getElementById('splash-logo');

            if (isRaidActive) {
                // Show 30, slide splash logo up + out
                logoEl.classList.remove('show');
                logoEl.classList.add('out');
                timerEl.classList.remove('out');
            } else {
                // Hide 30, bring splash logo up from bottom
                timerEl.classList.add('out');
                logoEl.classList.remove('out');
                logoEl.classList.add('show');
            }
        }

        // ==========================================
        // RAIDER NAME ROTATION
        //   While raid is active, alternate the raiding team's bar text
        //   between the team name (5 s) and the raider name (3 s).
        // ==========================================
        function handleRaiderNameRotation(state, data, visualLeftKey, leftColor, rightColor) {
            const timeInt = parseInt(data.raid_clock);
            const raidActive = state.raidTimerRunning === true
                || (!isNaN(timeInt) && timeInt > 0 && timeInt < 30);

            if (!raidActive) {
                // Raid ended → stop both rotations, restore team names
                stopRaiderRotation('left');
                stopRaiderRotation('right');
                raiderRotationState.left.currentRaider  = null;
                raiderRotationState.right.currentRaider = null;
                return;
            }

            // Which ACTUAL team is raiding?
            let actualLeftRaid = true;
            const raw = state.currentRaidTeamIsLeft !== undefined
                ? state.currentRaidTeamIsLeft
                : state.currentRaidTeamsLeft;
            if (raw === true  || raw === 1 || raw === '1' || raw === 'true')  actualLeftRaid = true;
            else if (raw === false || raw === 0 || raw === '0' || raw === 'false') actualLeftRaid = false;

            const visualLeftRaid = (visualLeftKey === 'left') ? actualLeftRaid : !actualLeftRaid;

            const raiderName = (data.active_raider_name || '').trim() || 'RAIDER';

            if (visualLeftRaid) {
                startRaiderRotation('left', raiderName);
                stopRaiderRotation('right');
                raiderRotationState.right.currentRaider = null;
            } else {
                startRaiderRotation('right', raiderName);
                stopRaiderRotation('left');
                raiderRotationState.left.currentRaider = null;
            }
        }

        function startRaiderRotation(side, raiderName) {
            const st = raiderRotationState[side];

            // If already running with the same raider, do nothing
            if (st.active && st.currentRaider === raiderName) return;

            // If already running with a different raider, update the text & continue cycle
            const container = document.querySelector(`#${side}-team-bg .name-rotator`);
            if (!container) return;
            const nameEl   = container.querySelector('.team-name-text');
            const raiderEl = container.querySelector('.raider-name-text');
            raiderEl.innerText = raiderName;

            if (st.active && st.currentRaider !== raiderName) {
                // Just update the stored name — cycle continues
                st.currentRaider = raiderName;
                return;
            }

            // Fresh start
            if (st.timer) { clearTimeout(st.timer); st.timer = null; }
            st.active = true;
            st.currentRaider = raiderName;

            // Reset visual state
            nameEl.classList.remove('out');
            raiderEl.classList.remove('show', 'out');

            // First: slide team name out, raider name in
            nameEl.classList.add('out');
            raiderEl.classList.add('show');

            let showingRaider = true;

            const tick = () => {
                if (!st.active) return;
                if (showingRaider) {
                    // Raider out, team name in
                    raiderEl.classList.remove('show');
                    raiderEl.classList.add('out');
                    nameEl.classList.remove('out');
                    showingRaider = false;
                    st.timer = setTimeout(tick, 5000);
                } else {
                    // Team name out, raider in
                    nameEl.classList.add('out');
                    raiderEl.classList.remove('out');
                    raiderEl.classList.add('show');
                    showingRaider = true;
                    st.timer = setTimeout(tick, 3000);
                }
            };
            st.timer = setTimeout(tick, 3000); // First raider shows for 3 s
        }

        function stopRaiderRotation(side) {
            const st = raiderRotationState[side];
            if (st.timer) { clearTimeout(st.timer); st.timer = null; }
            st.active = false;

            const container = document.querySelector(`#${side}-team-bg .name-rotator`);
            if (!container) return;
            const nameEl   = container.querySelector('.team-name-text');
            const raiderEl = container.querySelector('.raider-name-text');
            raiderEl.classList.remove('show');
            raiderEl.classList.remove('out');
            nameEl.classList.remove('out');
        }

        // ==========================================
        // DO-OR-DIE
        // ==========================================
        function handleDoOrDie(state, visualLeftKey, visualRightKey, raidClockStr) {
            const dodLeftBanner  = document.getElementById('dod-left');
            const dodRightBanner = document.getElementById('dod-right');
            const leftBar  = document.getElementById('left-team-bg');
            const rightBar = document.getElementById('right-team-bg');
            const leftWrap  = document.getElementById('left-team-wrap');
            const rightWrap = document.getElementById('right-team-wrap');

            let actualLeftRaid = true;
            const raw = state.currentRaidTeamIsLeft !== undefined
                ? state.currentRaidTeamIsLeft
                : state.currentRaidTeamsLeft;
            if (raw === true  || raw === 1 || raw === '1' || raw === 'true')  actualLeftRaid = true;
            else if (raw === false || raw === 0 || raw === '0' || raw === 'false') actualLeftRaid = false;

            const timeInt = parseInt(raidClockStr);
            const raidActive = state.raidTimerRunning === true
                || (!isNaN(timeInt) && timeInt > 0 && timeInt < 30);

            const visualLeftRaid = (visualLeftKey === 'left') ? actualLeftRaid : !actualLeftRaid;
            const visualRightRaid = !visualLeftRaid;

            const visualLeftEmpty  = parseInt(state[visualLeftKey  + 'EmptyRaids']) || 0;
            const visualRightEmpty = parseInt(state[visualRightKey + 'EmptyRaids']) || 0;

            const leftDOD  = raidActive && visualLeftRaid  && visualLeftEmpty  >= 2;
            const rightDOD = raidActive && visualRightRaid && visualRightEmpty >= 2;

            if (leftDOD) {
                dodLeftBanner.classList.add('show');
                leftBar.classList.add('dod-active');
                leftWrap.classList.add('dod-active');
            } else {
                dodLeftBanner.classList.remove('show');
                leftBar.classList.remove('dod-active');
                leftWrap.classList.remove('dod-active');
            }

            if (rightDOD) {
                dodRightBanner.classList.add('show');
                rightBar.classList.add('dod-active');
                rightWrap.classList.add('dod-active');
            } else {
                dodRightBanner.classList.remove('show');
                rightBar.classList.remove('dod-active');
                rightWrap.classList.remove('dod-active');
            }
        }

        // ==========================================
        // SIDE BANNER
        // ==========================================
        function showSideBanner(labelText, detailText, isLeftTeam, isFoul) {
            const banner = document.getElementById('side-banner');
            const label  = document.getElementById('side-banner-label');
            const detail = document.getElementById('side-banner-detail');

            let visualLeft;
            if (isLeftTeam === true)      visualLeft = !isSwapped;
            else if (isLeftTeam === false) visualLeft = isSwapped;
            else                           visualLeft = true;

            label.innerText  = labelText;
            detail.innerText = detailText;

            banner.className = 'side-banner ' + (visualLeft ? 'pos-left' : 'pos-right');
            if (isFoul) banner.classList.add('foul');

            void banner.offsetWidth;
            banner.classList.add('show');

            clearTimeout(banner._hideTimer);
            banner._hideTimer = setTimeout(() => {
                banner.classList.remove('show');
            }, 5000);
        }

        // ==========================================
        // EVENT TIMELINE
        // ==========================================
        function handleEventTimeline(state) {
            if (!state.logsJson) return;
            try {
                const logs = JSON.parse(state.logsJson);
                if (logs.length === 0) return;

                const latestLog = logs[logs.length - 1];

                if (latestLog.id !== previousLogId) {
                    previousLogId = latestLog.id;
                    const title = (latestLog.title || '').toLowerCase();
                    const type  = latestLog.type  || '';

                    if (title.includes("substitution") || title.includes("सब्स्टीट्यूशन")) {
                        showSideBanner('Substitution', latestLog.desc || '', latestLog.isLeftTeam, false);
                    }
                    else if (type === 'CARD' || title.includes("card") || title.includes("फाउल")) {
                        let labelText = 'FOUL';
                        if (title.includes('red')    || title.includes('लाल'))  labelText = '🟥 RED CARD';
                        else if (title.includes('yellow') || title.includes('पीला')) labelText = '🟨 YELLOW CARD';
                        else if (title.includes('green')  || title.includes('हरा'))  labelText = '🟩 GREEN CARD';
                        showSideBanner(labelText, latestLog.desc || '', latestLog.isLeftTeam, true);
                    }
                    else if (type === 'ALL_OUT' || title.includes("all out")) {
                        playEpicAnimation('all_out');
                    }
                    else if (type === 'SUPER_TACKLE' || title.includes("super tackle")) {
                        playEpicAnimation('super_tackle');
                    }
                    else if (title.includes("super raid") || (type === "RAID" && latestLog.points >= 3)) {
                        playEpicAnimation('super_raid');
                    }
                }
            } catch (e) {
                console.warn("Logs JSON parse error", e);
            }
        }

        // ==========================================
        // FULL-SCREEN EPIC ANIMATION (Super Raid / Super Tackle / All Out)
        //   Phase 1 (0–550ms)  : entry slam — bg fade-in, hBar scaleX, container overshoot
        //   Phase 2 (550–1750): slow float hold — container to 1.05
        //   Phase 3 (1750–2150): hyper-zoom exit — container to 25x + fade out
        // ==========================================
        let epicAnimationTimeoutIds = [];
        let epicIsPlaying = false;

        function playEpicAnimation(eventType) {
            const overlay   = document.getElementById('epic-overlay');
            const superText = document.getElementById('epic-super-text');
            const eventText = document.getElementById('epic-event-text');
            if (!overlay || !superText || !eventText) return;

            // Configure text per event
            if (eventType === 'super_tackle') {
                superText.style.display = 'block';
                superText.innerText = 'SUPER';
                eventText.innerText = 'TACKLE';
            } else if (eventType === 'super_raid') {
                superText.style.display = 'block';
                superText.innerText = 'SUPER';
                eventText.innerText = 'RAID';
            } else if (eventType === 'all_out') {
                superText.style.display = 'none';
                eventText.innerText = 'ALL OUT';
            }

            // Clear any pending phase timers from a previous run
            epicAnimationTimeoutIds.forEach(id => clearTimeout(id));
            epicAnimationTimeoutIds = [];

            // Reset all classes so animations restart
            overlay.classList.remove('entry', 'hold', 'exit', 'visible');
            void overlay.offsetWidth; // reflow

            // Phase 1: entry slam
            overlay.classList.add('visible', 'entry');
            epicIsPlaying = true;

            // Phase 2: hold after entry completes
            epicAnimationTimeoutIds.push(setTimeout(() => {
                if (!epicIsPlaying) return;
                overlay.classList.remove('entry');
                overlay.classList.add('hold');
            }, 550));

            // Phase 3: exit
            epicAnimationTimeoutIds.push(setTimeout(() => {
                if (!epicIsPlaying) return;
                overlay.classList.remove('hold');
                overlay.classList.add('exit');
            }, 1750));

            // Cleanup
            epicAnimationTimeoutIds.push(setTimeout(() => {
                overlay.classList.remove('visible', 'exit');
                epicIsPlaying = false;
            }, 2200));
        }
    </script>
</body>
