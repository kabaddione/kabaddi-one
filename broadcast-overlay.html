<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KabaddiOne Broadcast Overlay</title>
    
    <!-- Google Fonts for Professional Sports Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        /* =========================================
           OBS TRANSPARENT CANVAS RESET
           ========================================= */
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background: transparent !important;
            overflow: hidden;
            font-family: 'Oswald', sans-serif;
        }

        .broadcast-stage {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 1920px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 10;
        }

        /* =========================================
           METALLIC GOLD ACCENTS
           ========================================= */
        .gold-gradient {
            background: linear-gradient(to bottom, #FFF3A3 0%, #D4AF37 40%, #AA7700 60%, #FFD700 100%);
            box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
        }

        /* =========================================
           MAIN SCOREBOARD ARCHITECTURE
           ========================================= */
        .scoreboard-container {
            display: flex;
            align-items: center;
            position: relative;
            width: 1700px;
            height: 90px;
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.8));
        }

        /* Left & Right Team Blocks */
        .team-block {
            display: flex;
            flex-direction: column;
            position: relative;
            width: 600px;
            height: 100%;
        }

        /* The Main Name & Score Row */
        .name-score-row {
            display: flex;
            height: 65px;
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .team-name {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 420px;
            color: white;
            font-size: 34px;
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            border: 3px solid #D4AF37;
            border-bottom: none;
            background: #1A1A1A;
        }

        /* EXACT PKL SLANTED SHAPES USING CLIP-PATH */
        .left-name {
            clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
            padding-right: 30px;
            border-right: none;
            justify-content: flex-start;
            padding-left: 30px;
        }
        
        .right-name {
            clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%);
            padding-left: 30px;
            border-left: none;
            justify-content: flex-end;
            padding-right: 30px;
        }

        /* Score Boxes */
        .score-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1A1A1A;
            color: white;
            font-family: 'Teko', sans-serif;
            font-size: 60px;
            font-weight: 700;
            width: 180px;
            margin: 0 -10px;
            z-index: 3;
            border: 3px solid #D4AF37;
            box-shadow: inset 0px -10px 15px rgba(0,0,0,0.8), inset 0px 10px 15px rgba(255,255,255,0.1);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .left-score { 
            clip-path: polygon(15% 0, 100% 0, 85% 100%, 0 100%); 
            padding-right: 20px;
        }
        .right-score { 
            clip-path: polygon(0 0, 85% 0, 100% 100%, 15% 100%); 
            padding-left: 20px;
        }

        /* The Dots Bar (Underneath the team names) */
        .dots-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 25px;
            margin-top: -3px;
            z-index: 1;
            width: 420px;
        }

        .left-dots-bar {
            clip-path: polygon(0 0, 92% 0, 88% 100%, 0 100%);
            padding-right: 30px;
            justify-content: flex-start;
            padding-left: 30px;
        }

        .right-dots-bar {
            clip-path: polygon(8% 0, 100% 0, 100% 100%, 12% 100%);
            padding-left: 30px;
            justify-content: flex-end;
            padding-right: 30px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            background: transparent;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .dot.active { 
            background: #00FF00; 
            border-color: #00FF00; 
            box-shadow: 0px 0px 10px #00FF00;
        }

        /* =========================================
           CENTER TIMER & HALF INDICATOR
           ========================================= */
        .center-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 260px;
            height: 75px;
            background: linear-gradient(to right, #1A1A1A, #000000, #1A1A1A);
            border: 3px solid #D4AF37;
            clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);
            margin: 0 -20px;
            z-index: 4;
            color: white;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.8);
        }

        .center-top-row {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            color: #FFD700;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: -5px;
        }

        .timer-text {
            font-family: 'Teko', sans-serif;
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
            margin-top: -5px;
            color: #FFFFFF;
            text-shadow: 0px 0px 10px rgba(255, 215, 0, 0.5);
        }

        .trophy-icon {
            width: 18px;
            height: 18px;
            fill: #FFD700;
        }

        /* =========================================
           DYNAMIC EVENTS: DO-OR-DIE & SUBSTITUTION
           ========================================= */
        .event-banner {
            position: absolute;
            bottom: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 26px;
            height: 50px;
            padding: 0 40px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(20px);
            z-index: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.6);
        }

        .event-banner.show {
            opacity: 1;
            transform: translateY(0);
        }

        .dod-left {
            left: 40px;
            background: linear-gradient(to right, #D32F2F, #B71C1C);
            clip-path: polygon(0 0, 90% 0, 85% 100%, 0 100%);
            border-top: 3px solid #FF5252;
            padding-right: 60px;
        }

        .dod-right {
            right: 40px;
            background: linear-gradient(to left, #D32F2F, #B71C1C);
            clip-path: polygon(10% 0, 100% 0, 100% 100%, 15% 100%);
            border-top: 3px solid #FF5252;
            padding-left: 60px;
        }

        .sub-popup {
            position: absolute;
            bottom: 75px;
            right: 40px;
            background: linear-gradient(to right, #111, #333);
            border: 2px solid #D4AF37;
            padding: 5px 30px;
            font-size: 20px;
            clip-path: polygon(10% 0, 100% 0, 100% 100%, 0% 100%);
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            height: 45px;
        }

        .sub-arrow-in { 
            color: #00FF00; 
            font-weight: bold; 
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .sub-arrow-out { 
            color: #FF0000; 
            font-weight: bold; 
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Center Event Popups (Raid Point, Tackle, All Out, etc.) */
        .center-event-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: linear-gradient(to bottom, #D32F2F, #8B0000);
            border: 4px solid #FFD700;
            border-radius: 10px;
            padding: 15px 60px;
            color: white;
            font-family: 'Teko', sans-serif;
            font-size: 48px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0px 0px 30px rgba(255, 215, 0, 0.5);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            pointer-events: none;
        }

        .center-event-popup.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .center-event-popup.all-out {
            background: linear-gradient(to bottom, #D32F2F, #8B0000);
            font-size: 72px;
            padding: 20px 100px;
            box-shadow: 0px 0px 50px rgba(255, 0, 0, 0.8);
        }

        .center-event-popup.super-tackle {
            background: linear-gradient(to bottom, #FF8F00, #E65100);
            font-size: 60px;
            padding: 20px 80px;
        }

        .center-event-popup.raid-point {
            background: linear-gradient(to bottom, #1976D2, #0D47A1);
            font-size: 50px;
        }

        /* Animations */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); background: #FFF3A3; color: #000; }
            100% { transform: scale(1); }
        }
        .score-pop { animation: pop 0.6s ease-in-out; }

        @keyframes siren {
            0% { box-shadow: inset 0 0 0px #FF0000; }
            50% { box-shadow: inset 0 0 30px #FF0000; }
            100% { box-shadow: inset 0 0 0px #FF0000; }
        }
        .siren-flash { animation: siren 1s infinite; }

        /* Full Screen All Out Overlay */
        .full-screen-all-out {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 200;
            pointer-events: none;
        }

        .full-screen-all-out.show {
            opacity: 1;
        }

        .full-screen-all-out-text {
            font-family: 'Teko', sans-serif;
            font-size: 120px;
            font-weight: 700;
            color: #FFD700;
            text-transform: uppercase;
            letter-spacing: 10px;
            text-shadow: 0px 0px 30px rgba(255, 0, 0, 0.8);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

    </style>
</head>
<body>

    <!-- OBS RENDER STAGE -->
    <div class="broadcast-stage">
        
        <!-- DO OR DIE OVERLAYS (Hidden by default) -->
        <div id="dod-left" class="event-banner dod-left">🚨 DO-OR-DIE</div>
        
        <div class="scoreboard-container">
            
            <!-- LEFT TEAM -->
            <div class="team-block">
                <div class="name-score-row">
                    <div id="left-name" class="team-name left-name" style="background-color: #006400;">PATNA PIRATES</div>
                    <div id="left-score" class="score-box left-score">0</div>
                </div>
                <!-- Left Dots Bar -->
                <div id="left-dots-bar" class="dots-bar left-dots-bar gold-gradient">
                    <div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div>
                </div>
            </div>

            <!-- CENTER TIMER -->
            <div class="center-block">
                <div class="center-top-row">
                    <span id="half-status">1st HALF</span>
                    <svg class="trophy-icon" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
                    <span id="match-status">FINAL</span>
                </div>
                <div id="main-timer" class="timer-text">20:00</div>
            </div>

            <!-- RIGHT TEAM -->
            <div class="team-block">
                <!-- Substitution Popup Anchor -->
                <div id="sub-popup" class="event-banner sub-popup">
                    <span>सब्स्टीट्यूशन (SUB)</span> <span id="sub-player-name" class="sub-arrow-in">▲ Player Name</span>
                </div>
                <div id="dod-right" class="event-banner dod-right">DO-OR-DIE 🚨</div>

                <div class="name-score-row">
                    <div id="right-score" class="score-box right-score">0</div>
                    <div id="right-name" class="team-name right-name" style="background-color: #1976D2;">BENGAL WARRIORS</div>
                </div>
                <!-- Right Dots Bar -->
                <div id="right-dots-bar" class="dots-bar right-dots-bar gold-gradient">
                    <div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- CENTER EVENT POPUPS (Raid Point, Tackle, All Out, etc.) -->
    <div id="center-event-popup" class="center-event-popup">RAID POINT</div>
    
    <!-- FULL SCREEN ALL OUT OVERLAY -->
    <div id="full-screen-all-out" class="full-screen-all-out">
        <div class="full-screen-all-out-text">ALL OUT</div>
    </div>

    <script>
        // ==========================================
        // FIREBASE INITIALIZATION
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://kabaddi-scoreboard-e1522-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Extract Match ID from URL (e.g., ?match=ABC123)
        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('match');

        if (!matchId) {
            document.getElementById('left-name').innerText = "NO MATCH ID";
            document.getElementById('right-name').innerText = "LINK URL ERROR";
        } else {
            initBroadcastEngine(matchId);
        }

        // ==========================================
        // BROADCAST GRAPHICS ENGINE
        // ==========================================
        let previousLeftScore = -1;
        let previousRightScore = -1;
        let previousLogId = null;
        let previousAllOut = false;
        let previousSuperTackle = false;
        let previousRaidPoint = false;

        function initBroadcastEngine(id) {
            const matchRef = db.ref('live_matches/' + id);

            matchRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // 1. UPDATE TEAM NAMES & COLORS
                document.getElementById('left-name').innerText = data.left_name || "TEAM A";
                document.getElementById('right-name').innerText = data.right_name || "TEAM B";
                
                document.getElementById('left-name').style.backgroundColor = data.left_color || "#006400";
                document.getElementById('right-name').style.backgroundColor = data.right_color || "#1976D2";

                // 2. UPDATE SCORES WITH POP ANIMATION
                updateScoreWithAnimation('left-score', data.left_score || 0, previousLeftScore);
                updateScoreWithAnimation('right-score', data.right_score || 0, previousRightScore);
                previousLeftScore = data.left_score || 0;
                previousRightScore = data.right_score || 0;

                // 3. UPDATE CENTER CLOCK & STATUS
                document.getElementById('main-timer').innerText = data.main_clock || "00:00";
                document.getElementById('half-status').innerText = data.half_status || "1st HALF";
                if(data.match_result) {
                    document.getElementById('match-status').innerText = "FULL TIME";
                    document.getElementById('main-timer').innerText = "00:00";
                }

                // 4. PARSE DEEP STATE JSON FOR DOTS & EVENTS
                if (data.state_json) {
                    try {
                        const state = JSON.parse(data.state_json);
                        
                        // Render 7 Dots physically on screen
                        renderDots('left-dot', state.leftDotStates, data.left_color || "#006400");
                        renderDots('right-dot', state.rightDotStates, data.right_color || "#1976D2");

                        // Handle Do-Or-Die Siren Graphic
                        handleDoOrDie(state);

                        // Handle Center Event Popups (All Out, Super Tackle, Raid Point)
                        handleCenterEvents(state);

                        // Extract timeline logs to catch substitutions and events
                        handleEventTimeline(state);
                    } catch (e) {
                        console.warn("State JSON parse error", e);
                    }
                }
            });
        }

        // --- SCORE POP ANIMATION ---
        function updateScoreWithAnimation(elementId, newScore, oldScore) {
            const el = document.getElementById(elementId);
            if (oldScore !== -1 && newScore > oldScore) {
                el.innerText = newScore;
                el.classList.remove('score-pop');
                void el.offsetWidth; // Trigger DOM reflow to restart animation
                el.classList.add('score-pop');
            } else {
                el.innerText = newScore;
            }
        }

        // --- DOTS RENDERER ---
        function renderDots(dotClassName, stateArray, activeColor) {
            const dots = document.getElementsByClassName(dotClassName);
            if(stateArray && stateArray.length > 0) {
                for(let i=0; i<7; i++) {
                    if(stateArray[i] === true) {
                        dots[i].style.backgroundColor = activeColor;
                        dots[i].style.borderColor = "#FFFFFF";
                        dots[i].classList.add('active');
                    } else {
                        dots[i].style.backgroundColor = "transparent";
                        dots[i].style.borderColor = "rgba(255,255,255,0.3)";
                        dots[i].classList.remove('active');
                    }
                }
            }
        }

        // --- DO OR DIE GRAPHIC LOGIC ---
        function handleDoOrDie(state) {
            const dodLeft = document.getElementById('dod-left');
            const dodRight = document.getElementById('dod-right');
            const leftNameBox = document.getElementById('left-name');
            const rightNameBox = document.getElementById('right-name');

            const isLeftDoOrDie = state.currentRaidTeamIsLeft && state.leftEmptyRaids >= 2;
            const isRightDoOrDie = !state.currentRaidTeamIsLeft && state.rightEmptyRaids >= 2;

            if (isLeftDoOrDie) {
                dodLeft.classList.add('show');
                leftNameBox.classList.add('siren-flash');
            } else {
                dodLeft.classList.remove('show');
                leftNameBox.classList.remove('siren-flash');
            }

            if (isRightDoOrDie) {
                dodRight.classList.add('show');
                rightNameBox.classList.add('siren-flash');
            } else {
                dodRight.classList.remove('show');
                rightNameBox.classList.remove('siren-flash');
            }
        }

        // --- CENTER EVENT POPUPS (All Out, Super Tackle, Raid Point) ---
        function handleCenterEvents(state) {
            const popup = document.getElementById('center-event-popup');
            const allOutOverlay = document.getElementById('full-screen-all-out');
            
            // All Out Detection
            if (state.isAllOut && !previousAllOut) {
                popup.innerText = "ALL OUT";
                popup.className = "center-event-popup show all-out";
                allOutOverlay.classList.add('show');
                
                setTimeout(() => {
                    popup.classList.remove('show');
                    allOutOverlay.classList.remove('show');
                }, 4000);
                previousAllOut = true;
            } else if (!state.isAllOut) {
                previousAllOut = false;
            }

            // Super Tackle Detection
            if (state.isSuperTackle && !previousSuperTackle) {
                popup.innerText = "SUPER TACKLE";
                popup.className = "center-event-popup show super-tackle";
                
                setTimeout(() => {
                    popup.classList.remove('show');
                }, 3000);
                previousSuperTackle = true;
            } else if (!state.isSuperTackle) {
                previousSuperTackle = false;
            }

            // Raid Point Detection
            if (state.isRaidPoint && !previousRaidPoint) {
                popup.innerText = "RAID POINT";
                popup.className = "center-event-popup show raid-point";
                
                setTimeout(() => {
                    popup.classList.remove('show');
                }, 2000);
                previousRaidPoint = true;
            } else if (!state.isRaidPoint) {
                previousRaidPoint = false;
            }
        }

        // --- LIVE SUBSTITUTION / EVENT LOGIC ---
        function handleEventTimeline(state) {
            if(!state.logsJson) return;
            try {
                const logs = JSON.parse(state.logsJson);
                if(logs.length === 0) return;

                const latestLog = logs[logs.length - 1];
                
                // Only trigger if this is a NEW log we haven't animated yet
                if(latestLog.id !== previousLogId) {
                    previousLogId = latestLog.id;

                    if (latestLog.title && latestLog.title.includes("Substitution")) {
                        triggerSubstitutionGraphic(latestLog.desc);
                    }
                }
            } catch (e) {
                console.warn("Logs JSON parse error", e);
            }
        }

        function triggerSubstitutionGraphic(descText) {
            const subBanner = document.getElementById('sub-popup');
            const subName = document.getElementById('sub-player-name');
            
            subName.innerText = "🔄 " + descText;
            
            subBanner.classList.add('show');
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                subBanner.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
