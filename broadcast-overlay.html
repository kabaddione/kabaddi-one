<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KabaddiOne Broadcast Overlay</title>
    
    <!-- Google Fonts for Professional Sports Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        /* =========================================
           OBS TRANSPARENT CANVAS
           ========================================= */
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background: transparent !important;
            overflow: hidden;
            font-family: 'Oswald', sans-serif;
        }

        .broadcast-stage {
            position: absolute;
            bottom: 60px; /* Distance from bottom of the stream */
            left: 0;
            width: 1920px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 10;
        }

        /* =========================================
           METALLIC GOLD ACCENTS (As seen in screenshots)
           ========================================= */
        .gold-gradient {
            background: linear-gradient(to bottom, #FFF3A3 0%, #D4AF37 40%, #AA7700 60%, #FFD700 100%);
            box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
        }

        /* =========================================
           MAIN SCOREBOARD ARCHITECTURE
           ========================================= */
        .scoreboard-container {
            display: flex;
            align-items: center;
            position: relative;
        }

        /* Left & Right Team Blocks */
        .team-block {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* The Main Name & Score Row */
        .name-score-row {
            display: flex;
            height: 65px;
            position: relative;
            z-index: 2;
        }

        .team-name {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 320px;
            color: white;
            font-size: 32px;
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            border: 3px solid #D4AF37;
        }

        /* EXACT PKL SLANTED SHAPES USING CLIP-PATH */
        .left-name {
            clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
            padding-right: 20px;
            border-right: none;
        }
        
        .right-name {
            clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%);
            padding-left: 20px;
            border-left: none;
        }

        /* Score Boxes (White with bold black text) */
        .score-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            color: black;
            font-family: 'Teko', sans-serif;
            font-size: 55px;
            font-weight: 700;
            width: 90px;
            margin: 0 -5px; /* Pull them in slightly to overlap */
            z-index: 3;
            border: 3px solid #D4AF37;
            box-shadow: inset 0px -10px 15px rgba(0,0,0,0.1);
        }

        .left-score { clip-path: polygon(15% 0, 100% 0, 85% 100%, 0 100%); }
        .right-score { clip-path: polygon(0 0, 85% 0, 100% 100%, 15% 100%); }

        /* The Dots Bar (Underneath the team names) */
        .dots-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 25px;
            margin-top: -3px;
            z-index: 1;
        }

        .left-dots-bar {
            clip-path: polygon(0 0, 92% 0, 88% 100%, 0 100%);
            padding-right: 30px;
        }

        .right-dots-bar {
            clip-path: polygon(8% 0, 100% 0, 100% 100%, 12% 100%);
            padding-left: 30px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid white;
            background: transparent;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .dot.active { background: #00FF00; border-color: #00FF00; } /* Fallback, overridden by JS */

        /* =========================================
           CENTER TIMER & HALF INDICATOR
           ========================================= */
        .center-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 65px;
            background: linear-gradient(to right, #3A0066, #1A0033);
            border: 3px solid #D4AF37;
            clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);
            margin: 0 -15px;
            z-index: 4;
            color: white;
        }

        .center-top-row {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            color: #FFD700;
            font-weight: 700;
            text-transform: uppercase;
        }

        .timer-text {
            font-family: 'Teko', sans-serif;
            font-size: 38px;
            font-weight: 700;
            line-height: 1;
            margin-top: -2px;
        }

        /* =========================================
           DYNAMIC EVENTS: DO-OR-DIE & SUBSTITUTION
           ========================================= */
        .event-banner {
            position: absolute;
            bottom: 65px; /* Pops up right above the name */
            display: flex;
            align-items: center;
            color: white;
            font-weight: 700;
            font-size: 24px;
            height: 45px;
            padding: 0 30px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(20px);
            z-index: 0;
        }

        .event-banner.show {
            opacity: 1;
            transform: translateY(0);
        }

        .dod-left {
            left: 0;
            background: linear-gradient(to right, #D32F2F, #B71C1C);
            clip-path: polygon(0 0, 90% 0, 85% 100%, 0 100%);
            border-top: 3px solid #FF5252;
        }

        .dod-right {
            right: 0;
            background: linear-gradient(to left, #D32F2F, #B71C1C);
            clip-path: polygon(10% 0, 100% 0, 100% 100%, 15% 100%);
            border-top: 3px solid #FF5252;
        }

        .sub-popup {
            position: absolute;
            bottom: 65px;
            right: 0;
            background: linear-gradient(to right, #111, #333);
            border: 2px solid #D4AF37;
            padding: 5px 20px;
            font-size: 18px;
            clip-path: polygon(10% 0, 100% 0, 100% 100%, 0% 100%);
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
        }

        .sub-arrow-in { color: #00FF00; font-weight: bold; }
        .sub-arrow-out { color: #FF0000; font-weight: bold; }

        /* Animations */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); background: #FFF3A3; }
            100% { transform: scale(1); }
        }
        .score-pop { animation: pop 0.6s ease-in-out; }

        @keyframes siren {
            0% { box-shadow: inset 0 0 0px #FF0000; }
            50% { box-shadow: inset 0 0 30px #FF0000; }
            100% { box-shadow: inset 0 0 0px #FF0000; }
        }
        .siren-flash { animation: siren 1s infinite; }

    </style>
</head>
<body>

    <!-- OBS RENDER STAGE -->
    <div class="broadcast-stage">
        
        <!-- DO OR DIE OVERLAYS (Hidden by default) -->
        <div id="dod-left" class="event-banner dod-left">🚨 DO-OR-DIE</div>
        
        <div class="scoreboard-container">
            
            <!-- LEFT TEAM -->
            <div class="team-block">
                <div class="name-score-row">
                    <div id="left-name" class="team-name left-name" style="background-color: #006400;">PATNA PIRATES</div>
                    <div id="left-score" class="score-box left-score">0</div>
                </div>
                <!-- Left Dots Bar -->
                <div id="left-dots-bar" class="dots-bar left-dots-bar gold-gradient">
                    <div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div>
                </div>
            </div>

            <!-- CENTER TIMER -->
            <div class="center-block">
                <div class="center-top-row">
                    <span id="half-status">1st HALF</span>
                    <span>🏆</span>
                    <span id="match-status">FINAL</span>
                </div>
                <div id="main-timer" class="timer-text">20:00</div>
            </div>

            <!-- RIGHT TEAM -->
            <div class="team-block">
                <!-- Substitution Popup Anchor -->
                <div id="sub-popup" class="event-banner sub-popup">
                    <span>सब्स्टीट्यूशन (SUB)</span> <span id="sub-player-name" class="sub-arrow-in">▲ Player Name</span>
                </div>
                <div id="dod-right" class="event-banner dod-right">DO-OR-DIE 🚨</div>

                <div class="name-score-row">
                    <div id="right-score" class="score-box right-score">0</div>
                    <div id="right-name" class="team-name right-name" style="background-color: #1976D2;">BENGAL WARRIORS</div>
                </div>
                <!-- Right Dots Bar -->
                <div id="right-dots-bar" class="dots-bar right-dots-bar gold-gradient">
                    <div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // FIREBASE INITIALIZATION
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://kabaddi-scoreboard-e1522-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Extract Match ID from URL (e.g., ?match=ABC123)
        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('match');

        if (!matchId) {
            document.getElementById('left-name').innerText = "NO MATCH ID";
            document.getElementById('right-name').innerText = "LINK URL ERROR";
        } else {
            initBroadcastEngine(matchId);
        }

        // ==========================================
        // BROADCAST GRAPHICS ENGINE
        // ==========================================
        let previousLeftScore = -1;
        let previousRightScore = -1;
        let previousLogId = null;

        function initBroadcastEngine(id) {
            const matchRef = db.ref('live_matches/' + id);

            matchRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // 1. UPDATE TEAM NAMES & COLORS
                document.getElementById('left-name').innerText = data.left_name;
                document.getElementById('right-name').innerText = data.right_name;
                
                document.getElementById('left-name').style.backgroundColor = data.left_color;
                document.getElementById('right-name').style.backgroundColor = data.right_color;

                // 2. UPDATE SCORES WITH POP ANIMATION
                updateScoreWithAnimation('left-score', data.left_score, previousLeftScore);
                updateScoreWithAnimation('right-score', data.right_score, previousRightScore);
                previousLeftScore = data.left_score;
                previousRightScore = data.right_score;

                // 3. UPDATE CENTER CLOCK & STATUS
                document.getElementById('main-timer').innerText = data.main_clock || "00:00";
                document.getElementById('half-status').innerText = data.half_status || "1st HALF";
                if(data.match_result) {
                    document.getElementById('match-status').innerText = "FULL TIME";
                    document.getElementById('main-timer').innerText = "00:00";
                }

                // 4. PARSE DEEP STATE JSON FOR DOTS & DO-OR-DIE
                if (data.state_json) {
                    const state = JSON.parse(data.state_json);
                    
                    // Render 7 Dots physically on screen
                    renderDots('left-dot', state.leftDotStates, data.left_color);
                    renderDots('right-dot', state.rightDotStates, data.right_color);

                    // Handle Do-Or-Die Siren Graphic
                    handleDoOrDie(state);

                    // Extract timeline logs to catch substitutions and events
                    handleEventTimeline(state);
                }
            });
        }

        // --- SCORE POP ANIMATION ---
        function updateScoreWithAnimation(elementId, newScore, oldScore) {
            const el = document.getElementById(elementId);
            if (oldScore !== -1 && newScore > oldScore) {
                el.innerText = newScore;
                el.classList.remove('score-pop');
                void el.offsetWidth; // Trigger DOM reflow to restart animation
                el.classList.add('score-pop');
            } else {
                el.innerText = newScore;
            }
        }

        // --- DOTS RENDERER ---
        // Loops through the boolean array and paints the CSS circles exactly like the TV broadcast
        function renderDots(dotClassName, stateArray, activeColor) {
            const dots = document.getElementsByClassName(dotClassName);
            if(stateArray && stateArray.length > 0) {
                for(let i=0; i<7; i++) {
                    if(stateArray[i] === true) {
                        dots[i].style.backgroundColor = activeColor;
                        dots[i].style.borderColor = "#FFFFFF";
                    } else {
                        dots[i].style.backgroundColor = "transparent";
                        dots[i].style.borderColor = "rgba(255,255,255,0.3)";
                    }
                }
            }
        }

        // --- DO OR DIE GRAPHIC LOGIC ---
        function handleDoOrDie(state) {
            const dodLeft = document.getElementById('dod-left');
            const dodRight = document.getElementById('dod-right');
            const leftNameBox = document.getElementById('left-name');
            const rightNameBox = document.getElementById('right-name');

            const isLeftDoOrDie = state.currentRaidTeamIsLeft && state.leftEmptyRaids >= 2;
            const isRightDoOrDie = !state.currentRaidTeamIsLeft && state.rightEmptyRaids >= 2;

            if (isLeftDoOrDie) {
                dodLeft.classList.add('show');
                leftNameBox.classList.add('siren-flash');
            } else {
                dodLeft.classList.remove('show');
                leftNameBox.classList.remove('siren-flash');
            }

            if (isRightDoOrDie) {
                dodRight.classList.add('show');
                rightNameBox.classList.add('siren-flash');
            } else {
                dodRight.classList.remove('show');
                rightNameBox.classList.remove('siren-flash');
            }
        }

        // --- LIVE SUBSTITUTION / EVENT LOGIC ---
        // Reads the latest log in the array to pop up the substitution bar
        function handleEventTimeline(state) {
            if(!state.logsJson) return;
            const logs = JSON.parse(state.logsJson);
            if(logs.length === 0) return;

            const latestLog = logs[logs.length - 1];
            
            // Only trigger if this is a NEW log we haven't animated yet
            if(latestLog.id !== previousLogId) {
                previousLogId = latestLog.id;

                if (latestLog.title.includes("Substitution")) {
                    triggerSubstitutionGraphic(latestLog.desc);
                }
            }
        }

        function triggerSubstitutionGraphic(descText) {
            // Parses the text "Replaced by [Leaving] (No) [Sub] (No)"
            const subBanner = document.getElementById('sub-popup');
            const subName = document.getElementById('sub-player-name');
            
            subName.innerText = "🔄 " + descText;
            
            subBanner.classList.add('show');
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                subBanner.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
