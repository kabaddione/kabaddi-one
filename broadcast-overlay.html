<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KabaddiOne Broadcast Overlay</title>
    
    <!-- Google Fonts for Professional Sports Typography & Hindi -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Teko:wght@500;600;700&family=Mukta:wght@600;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        /* =========================================
           OBS TRANSPARENT CANVAS RESET
           ========================================= */
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background: transparent !important;
            overflow: hidden;
            font-family: 'Oswald', sans-serif;
        }

        .broadcast-stage {
            position: absolute;
            bottom: 80px; /* Positioned exactly like the reference */
            left: 0;
            width: 1920px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 10;
            filter: drop-shadow(0px 15px 25px rgba(0,0,0,0.9)); /* Heavy 3D shadow */
        }

        /* =========================================
           METALLIC GOLD & GLOSSY GRADIENTS
           ========================================= */
        .gold-border {
            border: 3px solid #D4AF37;
            box-shadow: inset 0px 0px 10px rgba(255, 215, 0, 0.5), 0px 0px 10px rgba(0,0,0,0.8);
        }

        .gold-text {
            background: linear-gradient(to bottom, #FFF3A3 0%, #D4AF37 50%, #AA7700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
        }

        /* =========================================
           MAIN SCOREBOARD CONTAINER
           ========================================= */
        .scoreboard-container {
            display: flex;
            align-items: center;
            position: relative;
            width: 1750px;
            height: 100px;
        }

        /* =========================================
           LEFT TEAM BLOCK (GREEN)
           ========================================= */
        .left-team-block {
            display: flex;
            flex-direction: column;
            position: relative;
            width: 600px;
            height: 90px;
            z-index: 1;
        }

        .left-name-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 65px;
            background: linear-gradient(to right, #003300, #009933, #00CC44, #009933, #003300); /* Glossy Green */
            clip-path: polygon(0% 0%, 98% 0%, 92% 100%, 0% 100%);
            border-top: 3px solid #D4AF37;
            border-left: 3px solid #D4AF37;
            border-bottom: 3px solid #D4AF37;
            position: relative;
            padding-left: 80px; /* Space for mascot */
            padding-right: 60px; /* Space for slant */
        }

        .left-mascot {
            position: absolute;
            left: 10px;
            bottom: 0;
            width: 70px;
            height: 85px;
            background: url('https://i.imgur.com/8YQ9Z7L.png') no-repeat center bottom; /* Placeholder for mascot */
            background-size: contain;
            z-index: 5;
        }

        .left-team-name {
            color: white;
            font-family: 'Mukta', sans-serif;
            font-size: 34px;
            font-weight: 800;
            text-transform: uppercase;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .left-dots-bar {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            height: 30px;
            width: 90%;
            background: linear-gradient(to right, #003300, #009933);
            clip-path: polygon(0% 0%, 100% 0%, 95% 100%, 0% 100%);
            border-bottom: 3px solid #D4AF37;
            border-left: 3px solid #D4AF37;
            padding-left: 80px;
            margin-top: -3px;
            z-index: 0;
        }

        /* =========================================
           RIGHT TEAM BLOCK (BLUE)
           ========================================= */
        .right-team-block {
            display: flex;
            flex-direction: column;
            position: relative;
            width: 600px;
            height: 90px;
            z-index: 1;
        }

        .right-name-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 65px;
            background: linear-gradient(to left, #001a4d, #0055ff, #0077ff, #0055ff, #001a4d); /* Glossy Blue */
            clip-path: polygon(2% 0%, 100% 0%, 100% 100%, 8% 100%);
            border-top: 3px solid #D4AF37;
            border-right: 3px solid #D4AF37;
            border-bottom: 3px solid #D4AF37;
            position: relative;
            padding-right: 80px; /* Space for player face */
            padding-left: 60px; /* Space for slant */
        }

        .right-player-face {
            position: absolute;
            right: 10px;
            bottom: 0;
            width: 70px;
            height: 85px;
            background: url('https://i.imgur.com/8YQ9Z7L.png') no-repeat center bottom; /* Placeholder for player face */
            background-size: contain;
            z-index: 5;
        }

        .right-team-name {
            color: white;
            font-family: 'Mukta', sans-serif;
            font-size: 34px;
            font-weight: 800;
            text-transform: uppercase;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .right-dots-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            height: 30px;
            width: 90%;
            background: linear-gradient(to left, #001a4d, #0055ff);
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 5% 100%);
            border-bottom: 3px solid #D4AF37;
            border-right: 3px solid #D4AF37;
            padding-right: 80px;
            margin-top: -3px;
            z-index: 0;
        }

        /* =========================================
           DOTS
           ========================================= */
        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #D4AF37;
            background: rgba(255,255,255,0.2);
            box-shadow: 0px 2px 4px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }
        .dot.active { 
            background: #00FF00; 
            border-color: #FFFFFF; 
            box-shadow: 0px 0px 10px #00FF00, 0px 0px 5px #FFFFFF inset;
        }
        .right-dot.active {
            background: #00FFFF; /* Cyan for right team in some PKL themes, or keep #00FF00 */
        }

        /* =========================================
           CENTER BLOCK (SCORES & TIMER)
           ========================================= */
        .center-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 550px;
            height: 110px;
            z-index: 10;
            margin: 0 -60px; /* Overlap with side blocks */
        }

        /* Scoreboard Background (White Trapezoid) */
        .score-background {
            position: absolute;
            top: 0;
            width: 100%;
            height: 70px;
            background: linear-gradient(to bottom, #FFFFFF, #E0E0E0);
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            border-bottom: 4px solid #D4AF37;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.7);
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .score-box {
            font-family: 'Teko', sans-serif;
            font-size: 70px;
            font-weight: 700;
            color: #000;
            width: 100px;
            text-align: center;
            line-height: 1;
            z-index: 2;
        }

        /* Central Gold Diamond */
        .gold-diamond {
            position: absolute;
            top: 15px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #FFF3A3, #D4AF37, #AA7700);
            transform: rotate(45deg);
            border: 2px solid #FFF;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.8);
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gold-diamond-text {
            transform: rotate(-45deg);
            font-family: 'Teko', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #000;
        }

        /* Timer & Half Status Background (Purple) */
        .timer-background {
            position: absolute;
            bottom: 0;
            width: 400px;
            height: 35px;
            background: linear-gradient(to right, #1A0033, #4A148C, #1A0033);
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
            border-top: 3px solid #D4AF37;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .timer-text {
            font-family: 'Teko', sans-serif;
            font-size: 24px;
            color: #FFD700;
            line-height: 1;
        }

        /* =========================================
           DYNAMIC EVENTS (DO-OR-DIE, SUB, POPUPS)
           ========================================= */
        .event-banner {
            position: absolute;
            bottom: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 28px;
            height: 50px;
            padding: 0 50px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(30px);
            z-index: 100;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.8);
        }

        .event-banner.show {
            opacity: 1;
            transform: translateY(0);
        }

        .dod-left {
            left: 100px;
            background: linear-gradient(to right, #D32F2F, #B71C1C);
            clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%);
            border-top: 4px solid #FF5252;
            border-left: 4px solid #FF5252;
            animation: siren 1s infinite;
        }

        .dod-right {
            right: 100px;
            background: linear-gradient(to left, #D32F2F, #B71C1C);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 10% 100%);
            border-top: 4px solid #FF5252;
            border-right: 4px solid #FF5252;
            animation: siren 1s infinite;
        }

        .sub-popup {
            position: absolute;
            bottom: 90px;
            right: 100px;
            background: linear-gradient(to right, #111, #333);
            border: 3px solid #D4AF37;
            padding: 5px 40px;
            font-size: 22px;
            clip-path: polygon(10% 0, 100% 0, 100% 100%, 0% 100%);
            display: flex;
            align-items: center;
            gap: 20px;
            color: white;
            height: 55px;
            z-index: 100;
        }

        .sub-arrow-in { color: #00FF00; font-weight: bold; }
        .sub-arrow-out { color: #FF0000; font-weight: bold; }

        /* Center Event Popups (All Out, Super Tackle, Raid Point) */
        .center-event-popup {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: linear-gradient(to bottom, #D32F2F, #8B0000);
            border: 5px solid #FFD700;
            border-radius: 15px;
            padding: 20px 100px;
            color: white;
            font-family: 'Teko', sans-serif;
            font-size: 80px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 6px;
            box-shadow: 0px 0px 50px rgba(255, 215, 0, 0.8);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
            white-space: nowrap;
        }

        .center-event-popup.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .center-event-popup.all-out {
            background: linear-gradient(to bottom, #D32F2F, #8B0000);
            font-size: 100px;
            padding: 30px 150px;
            box-shadow: 0px 0px 80px rgba(255, 0, 0, 0.9);
        }

        .center-event-popup.super-tackle {
            background: linear-gradient(to bottom, #FF8F00, #E65100);
            font-size: 80px;
        }

        .center-event-popup.raid-point {
            background: linear-gradient(to bottom, #1976D2, #0D47A1);
            font-size: 70px;
        }

        /* Animations */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #FFD700; text-shadow: 0px 0px 20px #FFD700; }
            100% { transform: scale(1); }
        }
        .score-pop { animation: pop 0.6s ease-in-out; }

        @keyframes siren {
            0% { box-shadow: 0 0 0px #FF0000, 0px 0px 20px #FF0000; }
            50% { box-shadow: 0 0 30px #FF0000, 0px 0px 40px #FF0000; }
            100% { box-shadow: 0 0 0px #FF0000, 0px 0px 20px #FF0000; }
        }

    </style>
</head>
<body>

    <!-- OBS RENDER STAGE -->
    <div class="broadcast-stage">
        
        <!-- DO OR DIE OVERLAYS -->
        <div id="dod-left" class="event-banner dod-left">🚨 DO-OR-DIE</div>
        <div id="dod-right" class="event-banner dod-right">DO-OR-DIE 🚨</div>
        
        <!-- SUBSTITUTION POPUP -->
        <div id="sub-popup" class="event-banner sub-popup">
            <span>सब्स्टीट्यूशन (SUB)</span> 
            <span id="sub-player-name" class="sub-arrow-in">▲ Player Name</span>
        </div>

        <div class="scoreboard-container">
            
            <!-- LEFT TEAM (GREEN) -->
            <div class="left-team-block">
                <div class="left-name-bar">
                    <div class="left-mascot"></div>
                    <div id="left-name" class="left-team-name">पटना पायरेट्स</div>
                </div>
                <div class="left-dots-bar">
                    <div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div>
                    <div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div>
                </div>
            </div>

            <!-- CENTER BLOCK (SCORES & TIMER) -->
            <div class="center-block">
                <!-- Background -->
                <div class="score-background">
                    <div id="left-score" class="score-box">0</div>
                    
                    <!-- Central Gold Diamond -->
                    <div class="gold-diamond">
                        <div id="raid-timer" class="gold-diamond-text">13</div>
                    </div>
                    
                    <div id="right-score" class="score-box">0</div>
                </div>

                <!-- Timer & Status Bar -->
                <div class="timer-background">
                    <span id="half-status">1st HALF</span>
                    <span>|</span>
                    <span id="match-status">फाइनल</span>
                    <span>|</span>
                    <span id="main-timer" class="timer-text">20:00</span>
                </div>
            </div>

            <!-- RIGHT TEAM (BLUE) -->
            <div class="right-team-block">
                <div class="right-name-bar">
                    <div id="right-name" class="right-team-name">हरियाणा स्टीलर्स</div>
                    <div class="right-player-face"></div>
                </div>
                <div class="right-dots-bar">
                    <div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div>
                    <div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- CENTER EVENT POPUPS (Raid Point, Tackle, All Out, etc.) -->
    <div id="center-event-popup" class="center-event-popup">RAID POINT</div>

    <script>
        // ==========================================
        // FIREBASE INITIALIZATION
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://kabaddi-scoreboard-e1522-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Extract Match ID from URL (e.g., ?match=ABC123)
        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('match');

        if (!matchId) {
            document.getElementById('left-name').innerText = "NO MATCH ID";
            document.getElementById('right-name').innerText = "LINK URL ERROR";
        } else {
            initBroadcastEngine(matchId);
        }

        // ==========================================
        // BROADCAST GRAPHICS ENGINE
        // ==========================================
        let previousLeftScore = -1;
        let previousRightScore = -1;
        let previousLogId = null;
        let previousAllOut = false;
        let previousSuperTackle = false;
        let previousRaidPoint = false;

        function initBroadcastEngine(id) {
            const matchRef = db.ref('live_matches/' + id);

            matchRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // 1. UPDATE TEAM NAMES
                document.getElementById('left-name').innerText = data.left_name || "TEAM A";
                document.getElementById('right-name').innerText = data.right_name || "TEAM B";

                // 2. UPDATE SCORES WITH POP ANIMATION
                updateScoreWithAnimation('left-score', data.left_score || 0, previousLeftScore);
                updateScoreWithAnimation('right-score', data.right_score || 0, previousRightScore);
                previousLeftScore = data.left_score || 0;
                previousRightScore = data.right_score || 0;

                // 3. UPDATE CENTER CLOCK & STATUS
                document.getElementById('main-timer').innerText = data.main_clock || "00:00";
                document.getElementById('half-status').innerText = data.half_status || "1st HALF";
                if(data.match_result) {
                    document.getElementById('match-status').innerText = "FULL TIME";
                    document.getElementById('main-timer').innerText = "00:00";
                } else {
                    document.getElementById('match-status').innerText = "फाइनल"; // Default Hindi Final
                }

                // 4. PARSE DEEP STATE JSON FOR DOTS & EVENTS
                if (data.state_json) {
                    try {
                        const state = JSON.parse(data.state_json);
                        
                        // Render 7 Dots physically on screen
                        renderDots('left-dot', state.leftDotStates);
                        renderDots('right-dot', state.rightDotStates);

                        // Update Raid Timer inside Diamond
                        if(state.raidTimer) {
                            document.getElementById('raid-timer').innerText = state.raidTimer;
                        }

                        // Handle Do-Or-Die Siren Graphic
                        handleDoOrDie(state);

                        // Handle Center Event Popups (All Out, Super Tackle, Raid Point)
                        handleCenterEvents(state);

                        // Extract timeline logs to catch substitutions and events
                        handleEventTimeline(state);
                    } catch (e) {
                        console.warn("State JSON parse error", e);
                    }
                }
            });
        }

        // --- SCORE POP ANIMATION ---
        function updateScoreWithAnimation(elementId, newScore, oldScore) {
            const el = document.getElementById(elementId);
            if (oldScore !== -1 && newScore > oldScore) {
                el.innerText = newScore;
                el.classList.remove('score-pop');
                void el.offsetWidth; // Trigger DOM reflow to restart animation
                el.classList.add('score-pop');
            } else {
                el.innerText = newScore;
            }
        }

        // --- DOTS RENDERER ---
        function renderDots(dotClassName, stateArray) {
            const dots = document.getElementsByClassName(dotClassName);
            if(stateArray && stateArray.length > 0) {
                for(let i=0; i<7; i++) {
                    if(stateArray[i] === true) {
                        dots[i].classList.add('active');
                    } else {
                        dots[i].classList.remove('active');
                    }
                }
            }
        }

        // --- DO OR DIE GRAPHIC LOGIC ---
        function handleDoOrDie(state) {
            const dodLeft = document.getElementById('dod-left');
            const dodRight = document.getElementById('dod-right');

            const isLeftDoOrDie = state.currentRaidTeamIsLeft && state.leftEmptyRaids >= 2;
            const isRightDoOrDie = !state.currentRaidTeamIsLeft && state.rightEmptyRaids >= 2;

            if (isLeftDoOrDie) {
                dodLeft.classList.add('show');
            } else {
                dodLeft.classList.remove('show');
            }

            if (isRightDoOrDie) {
                dodRight.classList.add('show');
            } else {
                dodRight.classList.remove('show');
            }
        }

        // --- CENTER EVENT POPUPS (All Out, Super Tackle, Raid Point) ---
        function handleCenterEvents(state) {
            const popup = document.getElementById('center-event-popup');
            
            // All Out Detection
            if (state.isAllOut && !previousAllOut) {
                popup.innerText = "ALL OUT";
                popup.className = "center-event-popup show all-out";
                setTimeout(() => { popup.classList.remove('show'); }, 4000);
                previousAllOut = true;
            } else if (!state.isAllOut) {
                previousAllOut = false;
            }

            // Super Tackle Detection
            if (state.isSuperTackle && !previousSuperTackle) {
                popup.innerText = "SUPER TACKLE";
                popup.className = "center-event-popup show super-tackle";
                setTimeout(() => { popup.classList.remove('show'); }, 3000);
                previousSuperTackle = true;
            } else if (!state.isSuperTackle) {
                previousSuperTackle = false;
            }

            // Raid Point Detection
            if (state.isRaidPoint && !previousRaidPoint) {
                popup.innerText = "RAID POINT";
                popup.className = "center-event-popup show raid-point";
                setTimeout(() => { popup.classList.remove('show'); }, 2000);
                previousRaidPoint = true;
            } else if (!state.isRaidPoint) {
                previousRaidPoint = false;
            }
        }

        // --- LIVE SUBSTITUTION / EVENT LOGIC ---
        function handleEventTimeline(state) {
            if(!state.logsJson) return;
            try {
                const logs = JSON.parse(state.logsJson);
                if(logs.length === 0) return;

                const latestLog = logs[logs.length - 1];
                
                // Only trigger if this is a NEW log we haven't animated yet
                if(latestLog.id !== previousLogId) {
                    previousLogId = latestLog.id;

                    if (latestLog.title && latestLog.title.includes("Substitution")) {
                        triggerSubstitutionGraphic(latestLog.desc);
                    }
                }
            } catch (e) {
                console.warn("Logs JSON parse error", e);
            }
        }

        function triggerSubstitutionGraphic(descText) {
            const subBanner = document.getElementById('sub-popup');
            const subName = document.getElementById('sub-player-name');
            
            subName.innerText = "🔄 " + descText;
            
            subBanner.classList.add('show');
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                subBanner.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
