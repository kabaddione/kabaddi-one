<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KabaddiOne Professional Broadcast Overlay</title>
    
    <!-- Professional Sports Typography & Hindi Support -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Teko:wght@600;700&family=Mukta:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        /* =========================================
           OBS TRANSPARENT CANVAS RESET
           ========================================= */
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background: transparent !important;
            overflow: hidden;
            font-family: 'Oswald', sans-serif;
        }

        /* =========================================
           MASTER POSITIONING CONTAINER & 3D SHADOW
           ========================================= */
        .broadcast-stage {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 1920px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Heavy 3D shadow applied to the entire interlocking unit */
            filter: drop-shadow(0px 15px 25px rgba(0,0,0,0.9)); 
        }

        /* =========================================
           METALLIC GOLD & GLOSSY GRADIENTS
           ========================================= */
        .gold-bg {
            background: linear-gradient(to bottom, #FFF3A3 0%, #D4AF37 40%, #AA7700 60%, #FFD700 100%);
        }

        /* =========================================
           TOP LAYER: RAID PROGRESS BARS
           ========================================= */
        .top-raid-bars {
            display: flex;
            justify-content: space-between;
            width: 1080px;
            margin-bottom: -4px;
            z-index: 5;
        }

        .raid-track {
            width: 420px;
            height: 14px;
            background: rgba(0,0,0,0.8);
            display: flex;
            overflow: hidden;
            visibility: hidden;
            border: 2px solid #D4AF37;
            border-bottom: none;
        }

        .track-left { justify-content: flex-end; border-top-left-radius: 6px; }
        .track-right { justify-content: flex-start; border-top-right-radius: 6px; }

        .raid-fill {
            height: 100%;
            width: 100%;
            background: #00FF00;
            box-shadow: 0px 0px 15px #00FF00;
            transition: width 1s linear;
        }

        .raid-fill.danger {
            background: #FF0000;
            box-shadow: 0px 0px 20px #FF0000;
        }

        /* =========================================
           LAYER 1: MAIN SCOREBOARD ROW (INTERLOCKING)
           ========================================= */
        .main-row {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            z-index: 10;
            height: 85px;
        }

        /* --- LEFT TEAM BAR --- */
        .team-left-wrap {
            width: 460px; height: 80px;
            clip-path: polygon(0 0, 90% 0, 100% 100%, 10% 100%);
            padding: 4px; padding-right: 5px;
            z-index: 1;
        }
        .team-left-inner {
            width: 100%; height: 100%;
            clip-path: polygon(0 0, 90% 0, 100% 100%, 10% 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-family: 'Mukta', sans-serif; font-size: 40px; font-weight: 800; text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            box-shadow: inset 0px 20px 20px rgba(255,255,255,0.2), inset 0px -20px 20px rgba(0,0,0,0.5);
        }

        /* --- LEFT SCORE BOX --- */
        .score-left-wrap {
            width: 180px; height: 85px;
            clip-path: polygon(0 0, 72% 0, 100% 100%, 28% 100%);
            margin-left: -40px;
            z-index: 2;
            padding: 5px;
        }
        .score-left-inner {
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, #FFFFFF, #D0D0D0);
            clip-path: polygon(0 0, 72% 0, 100% 100%, 28% 100%);
            display: flex; align-items: center; justify-content: center;
            color: black; font-family: 'Teko', sans-serif; font-size: 75px; font-weight: 700; padding-left: 15px; padding-top: 10px;
            box-shadow: inset 0px 10px 15px rgba(0,0,0,0.2);
        }

        /* --- CENTER RAID CLOCK TRIANGLE --- */
        .center-wrap {
            width: 140px; height: 105px;
            clip-path: polygon(0% 0%, 100% 0%, 65% 80%, 35% 80%);
            margin: 0 -45px;
            z-index: 3;
            padding: 5px;
        }
        .center-inner {
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, #6A1B9A, #1A0033);
            clip-path: polygon(0% 0%, 100% 0%, 65% 80%, 35% 80%);
            display: flex; align-items: flex-start; justify-content: center;
            padding-top: 15px;
            color: #FFD700; font-family: 'Teko', sans-serif; font-size: 45px; font-weight: 700; line-height: 1; text-shadow: 0px 0px 15px rgba(255,215,0,0.8);
        }

        /* --- RIGHT SCORE BOX --- */
        .score-right-wrap {
            width: 180px; height: 85px;
            clip-path: polygon(28% 0, 100% 0, 72% 100%, 0 100%);
            margin-left: 0px;
            z-index: 2;
            padding: 5px;
        }
        .score-right-inner {
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, #FFFFFF, #D0D0D0);
            clip-path: polygon(28% 0, 100% 0, 72% 100%, 0 100%);
            display: flex; align-items: center; justify-content: center;
            color: black; font-family: 'Teko', sans-serif; font-size: 75px; font-weight: 700; padding-right: 15px; padding-top: 10px;
            box-shadow: inset 0px 10px 15px rgba(0,0,0,0.2);
        }

        /* --- RIGHT TEAM BAR --- */
        .team-right-wrap {
            width: 460px; height: 80px;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            margin-left: -40px;
            z-index: 1;
            padding: 4px; padding-left: 5px;
        }
        .team-right-inner {
            width: 100%; height: 100%;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-family: 'Mukta', sans-serif; font-size: 40px; font-weight: 800; text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            box-shadow: inset 0px 20px 20px rgba(255,255,255,0.2), inset 0px -20px 20px rgba(0,0,0,0.5);
        }

        /* =========================================
           LAYER 2: BOTTOM INFO & DOTS BAR
           ========================================= */
        .bottom-row {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
            margin-top: -12px;
            z-index: 0;
        }

        /* --- LEFT DOTS BAR --- */
        .dots-left-wrap {
            width: 310px; height: 38px;
            clip-path: polygon(0 0, 93% 0, 100% 100%, 7% 100%);
            padding: 4px; padding-top: 0px; margin-right: 0px;
        }
        .dots-left-inner {
            width: 100%; height: 100%;
            clip-path: polygon(0 0, 93% 0, 100% 100%, 7% 100%);
            display: flex; align-items: center; justify-content: flex-end;
            padding-right: 45px; gap: 10px;
        }

        /* --- CENTER INFO BAR --- */
        .center-info-wrap {
            width: 500px; height: 45px;
            clip-path: polygon(15px 0, calc(100% - 15px) 0, 100% 100%, 0 100%);
            padding: 4px; padding-top: 15px; z-index: 4;
        }
        .center-info-inner {
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, #6A1B9A, #1A0033);
            clip-path: polygon(15px 0, calc(100% - 15px) 0, 100% 100%, 0 100%);
            display: flex; align-items: center; justify-content: center; gap: 25px;
            color: white; font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
        }
        .gold-text { color: #FFD700; font-family: 'Teko', sans-serif; font-size: 32px; line-height: 1; margin-top: 5px;}
        .divider { color: #888; font-weight: 400; font-size: 20px; }

        /* --- RIGHT DOTS BAR --- */
        .dots-right-wrap {
            width: 340px; height: 38px;
            clip-path: polygon(7% 100%, 0 0, 93% 0, 100% 100%)
            padding: 4px; padding-top: 12px; margin-left: -15px;
        }
        .dots-right-inner {
            width: 100%; height: 100%;
            clip-path: polygon(5% 0, 100% 0, 100% 100%, 0 100%);
            display: flex; align-items: center; justify-content: flex-start;
            padding-left: 45px; gap: 10px;
        }

        /* --- PLAYER DOTS --- */
        .dot {
            width: 16px; height: 16px;
            border-radius: 50%;
            border: 2px solid #D4AF37;
            background: rgba(255,255,255,0.2);
            box-shadow: 0px 2px 4px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }
        .dot.active { background: #00FF00; border-color: #FFFFFF; box-shadow: 0px 0px 10px #00FF00; }
        .right-dot.active { background: #00FFFF; box-shadow: 0px 0px 10px #00FFFF;}

        /* =========================================
           POPUP EVENT ANIMATIONS
           ========================================= */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #FFD700; text-shadow: 0px 0px 20px #FFD700; }
            100% { transform: scale(1); }
        }
        .score-pop { animation: pop 0.6s ease-in-out; }

        .sub-popup {
            position: absolute; bottom: 145px; right: 180px;
            background: linear-gradient(to left, #1A0033, #4A148C);
            border: 3px solid #D4AF37;
            padding: 5px 30px; font-size: 24px; color: white; font-weight: bold;
            display: flex; align-items: center; gap: 15px;
            clip-path: polygon(15px 0, 100% 0, 100% 100%, 0 100%);
            opacity: 0; transform: translateY(20px); transition: all 0.5s ease;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.8);
        }
        .sub-popup.show { opacity: 1; transform: translateY(0); }
        .sub-in { color: #00FF00; }

        .center-popup {
            position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            background: linear-gradient(to bottom, #D32F2F, #8B0000);
            border: 5px solid #FFD700; border-radius: 15px;
            padding: 20px 100px; color: white; font-family: 'Teko', sans-serif; font-size: 90px; font-weight: 700; letter-spacing: 6px;
            box-shadow: 0px 0px 50px rgba(255, 215, 0, 0.8);
            opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap; text-transform: uppercase;
        }
        .center-popup.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    </style>
</head>
<body>

    <!-- OBS RENDER STAGE -->
    <div class="broadcast-stage">
        
        <!-- SUBSTITUTION POPUP -->
        <div id="sub-popup" class="sub-popup">
            <span>सब्स्टीट्यूशन</span> 
            <span id="sub-player-name" class="sub-in">▲ Player Name</span>
        </div>

        <!-- TOP RAID PROGRESS BARS -->
        <div class="top-raid-bars">
            <div id="raid-track-left" class="raid-track track-left">
                <div id="raid-bar-left" class="raid-fill"></div>
            </div>
            <div id="raid-track-right" class="raid-track track-right">
                <div id="raid-bar-right" class="raid-fill"></div>
            </div>
        </div>

        <!-- MAIN SCOREBOARD ROW -->
        <div class="main-row">
            <!-- Left Team -->
            <div class="team-left-wrap gold-bg">
                <div class="team-left-inner" id="left-team-bg">
                    <span id="left-name">TEAM A</span>
                </div>
            </div>

            <!-- Left Score -->
            <div class="score-left-wrap gold-bg">
                <div class="score-left-inner">
                    <span id="left-score">0</span>
                </div>
            </div>

            <!-- Center Triangle (Raid Timer) -->
            <div class="center-wrap gold-bg">
                <div class="center-inner">
                    <span id="raid-timer">30</span>
                </div>
            </div>

            <!-- Right Score -->
            <div class="score-right-wrap gold-bg">
                <div class="score-right-inner">
                    <span id="right-score">0</span>
                </div>
            </div>

            <!-- Right Team -->
            <div class="team-right-wrap gold-bg">
                <div class="team-right-inner" id="right-team-bg">
                    <span id="right-name">TEAM B</span>
                </div>
            </div>
        </div>

        <!-- BOTTOM DOTS & INFO ROW -->
        <div class="bottom-row">
            <!-- Left Dots -->
            <div class="dots-left-wrap gold-bg">
                <div class="dots-left-inner" id="left-dots-bg">
                    <div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div><div class="dot left-dot"></div>
                </div>
            </div>

            <!-- Center Info Bar -->
            <div class="center-info-wrap gold-bg">
                <div class="center-info-inner">
                    <span id="half-status">1st HALF</span>
                    <span class="divider">|</span>
                    <span id="main-timer" class="gold-text">20:00</span>
                    <span class="divider">|</span>
                    <span id="match-id" style="color: #bbb; font-size: 16px;">ABC123</span>
                </div>
            </div>

            <!-- Right Dots -->
            <div class="dots-right-wrap gold-bg">
                <div class="dots-right-inner" id="right-dots-bg">
                    <div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div><div class="dot right-dot"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- CENTER SCREEN EVENT POPUP -->
    <div id="center-popup" class="center-popup">EVENT</div>

    <script>
        // ==========================================
        // FIREBASE INITIALIZATION
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://kabaddi-scoreboard-e1522-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Extract Match ID from URL (e.g., ?match=ABC123)
        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('match');

        if (!matchId) {
            document.getElementById('left-name').innerText = "NO MATCH ID";
            document.getElementById('right-name').innerText = "LINK URL ERROR";
        } else {
            document.getElementById('match-id').innerText = matchId.toUpperCase();
            initBroadcastEngine(matchId);
        }

        // ==========================================
        // BROADCAST GRAPHICS ENGINE
        // ==========================================
        let previousLeftScore = -1;
        let previousRightScore = -1;
        let previousLogId = null;
        let previousAllOut = false;
        let previousSuperTackle = false;
        let previousRaidPoint = false;

        function initBroadcastEngine(id) {
            const matchRef = db.ref('live_matches/' + id);

            matchRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // 1. UPDATE TEAM NAMES
                document.getElementById('left-name').innerText = data.left_name || "TEAM A";
                document.getElementById('right-name').innerText = data.right_name || "TEAM B";

                // 🚨 APPLY DYNAMIC GRADIENTS BASED ON TEAM COLORS
                const leftColor = data.left_color || "#009900";
                const rightColor = data.right_color || "#0055ff";
                
                // Apply glossy gradient to team bars
                document.getElementById('left-team-bg').style.background = `linear-gradient(to right, ${darkenColor(leftColor, 60)}, ${leftColor})`;
                document.getElementById('right-team-bg').style.background = `linear-gradient(to left, ${darkenColor(rightColor, 60)}, ${rightColor})`;
                
                // Apply solid dark color to dots bars
                document.getElementById('left-dots-bg').style.background = darkenColor(leftColor, 80);
                document.getElementById('right-dots-bg').style.background = darkenColor(rightColor, 80);

                // 2. UPDATE SCORES WITH POP ANIMATION
                updateScoreWithAnimation('left-score', data.left_score || 0, previousLeftScore);
                updateScoreWithAnimation('right-score', data.right_score || 0, previousRightScore);
                previousLeftScore = data.left_score || 0;
                previousRightScore = data.right_score || 0;

                // 3. UPDATE CENTER CLOCK & STATUS
                document.getElementById('main-timer').innerText = data.main_clock || "00:00";
                document.getElementById('half-status').innerText = data.half_status || "1st HALF";
                
                // 4. PARSE DEEP STATE JSON FOR DOTS & TIMERS
                if (data.state_json) {
                    try {
                        const state = JSON.parse(data.state_json);
                        
                        // Render 7 Dots
                        renderDots('left-dot', state.leftDotStates);
                        renderDots('right-dot', state.rightDotStates);

                        // Handle Raid Timer (Diamond Text & Shrinking Neon Bars)
                        handleRaidTimers(state, data.raid_clock);

                        // Check for major events in the timeline
                        handleEventTimeline(state);
                    } catch (e) {
                        console.warn("State JSON parse error", e);
                    }
                }
            });
        }

        // --- HELPER: DARKEN HEX COLOR FOR GRADIENTS ---
        function darkenColor(color, percent) {
            let R = parseInt(color.substring(1,3),16);
            let G = parseInt(color.substring(3,5),16);
            let B = parseInt(color.substring(5,7),16);

            R = parseInt(R * (100 - percent) / 100);
            G = parseInt(G * (100 - percent) / 100);
            B = parseInt(B * (100 - percent) / 100);

            R = (R<255)?R:255;  
            G = (G<255)?G:255;  
            B = (B<255)?B:255;  

            let RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
            let GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
            let BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));

            return "#"+RR+GG+BB;
        }

        // --- SCORE POP ANIMATION ---
        function updateScoreWithAnimation(elementId, newScore, oldScore) {
            const el = document.getElementById(elementId);
            if (oldScore !== -1 && newScore > oldScore) {
                el.innerText = newScore;
                el.classList.remove('score-pop');
                void el.offsetWidth; // Trigger DOM reflow to restart animation
                el.classList.add('score-pop');
            } else {
                el.innerText = newScore;
            }
        }

        // --- DOTS RENDERER ---
        function renderDots(dotClassName, stateArray) {
            const dots = document.getElementsByClassName(dotClassName);
            if(stateArray && stateArray.length > 0) {
                for(let i=0; i<7; i++) {
                    if(stateArray[i] === true) {
                        dots[i].classList.add('active');
                    } else {
                        dots[i].classList.remove('active');
                    }
                }
            }
        }

        // --- TOP NEON RAID TIMER PROGRESS BARS ---
        function handleRaidTimers(state, raidClockStr) {
            const raidTimerText = document.getElementById('raid-timer');
            const trackLeft = document.getElementById('raid-track-left');
            const trackRight = document.getElementById('raid-track-right');
            const barLeft = document.getElementById('raid-bar-left');
            const barRight = document.getElementById('raid-bar-right');

            // Set the central diamond text
            const timeInt = parseInt(raidClockStr);
            raidTimerText.innerText = isNaN(timeInt) ? "30" : timeInt;

            // Manage which side the progress bar appears on
            if (state.raidTimerRunning) {
                if (state.currentRaidTeamIsLeft) {
                    trackLeft.style.visibility = 'visible';
                    trackRight.style.visibility = 'hidden';
                } else {
                    trackRight.style.visibility = 'visible';
                    trackLeft.style.visibility = 'hidden';
                }

                // Calculate width percentage (shrinks from 100% to 0% based on 30 seconds)
                const percentage = Math.max(0, Math.min(100, (timeInt / 30) * 100));
                
                barLeft.style.width = percentage + "%";
                barRight.style.width = percentage + "%";

                // Turn red and pulse if 10 seconds or less
                if (timeInt <= 10) {
                    barLeft.classList.add('danger');
                    barRight.classList.add('danger');
                } else {
                    barLeft.classList.remove('danger');
                    barRight.classList.remove('danger');
                }
            } else {
                // If paused or stopped, hide the bars completely
                trackLeft.style.visibility = 'hidden';
                trackRight.style.visibility = 'hidden';
                barLeft.style.width = "100%";
                barRight.style.width = "100%";
                barLeft.classList.remove('danger');
                barRight.classList.remove('danger');
            }
        }

        // --- EVENT TIMELINE PARSER (Subs, All Outs, Super Raids) ---
        function handleEventTimeline(state) {
            if(!state.logsJson) return;
            try {
                const logs = JSON.parse(state.logsJson);
                if(logs.length === 0) return;

                const latestLog = logs[logs.length - 1];
                
                // Only trigger if this is a NEW event we haven't animated yet
                if(latestLog.id !== previousLogId) {
                    previousLogId = latestLog.id;
                    const title = latestLog.title || "";

                    if (title.includes("Substitution") || title.includes("सब्स्टीट्यूशन")) {
                        triggerSubstitutionGraphic(latestLog.desc);
                    } else if (title.includes("ALL OUT") || title.includes("All Out") || latestLog.type === "ALL_OUT") {
                        triggerCenterEvent("ALL OUT", "all-out", 4000);
                    } else if (title.includes("Super Tackle") || latestLog.type === "SUPER_TACKLE") {
                        triggerCenterEvent("SUPER TACKLE", "super-tackle", 3000);
                    } else if (title.includes("Super Raid") || (latestLog.type === "RAID" && latestLog.points >= 3)) {
                        triggerCenterEvent("SUPER RAID", "raid-point", 3000);
                    }
                }
            } catch (e) {
                console.warn("Logs JSON parse error", e);
            }
        }

        function triggerSubstitutionGraphic(descText) {
            const subBanner = document.getElementById('sub-popup');
            const subName = document.getElementById('sub-player-name');
            
            subName.innerText = "🔄 " + descText;
            subBanner.classList.add('show');
            
            setTimeout(() => {
                subBanner.classList.remove('show');
            }, 5000);
        }

        function triggerCenterEvent(text, styleClass, duration) {
            const popup = document.getElementById('center-popup');
            popup.innerText = text;
            
            // Apply unique background colors dynamically based on the event
            if (styleClass === 'all-out') popup.style.background = 'linear-gradient(to bottom, #D32F2F, #8B0000)';
            if (styleClass === 'super-tackle') popup.style.background = 'linear-gradient(to bottom, #FF8F00, #E65100)';
            if (styleClass === 'raid-point') popup.style.background = 'linear-gradient(to bottom, #1976D2, #0D47A1)';

            popup.classList.add('show');
            
            setTimeout(() => { 
                popup.classList.remove('show'); 
            }, duration);
        }
    </script>
</body>
</html>
