<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting… | KabaddiOne</title>
    <meta name="robots" content="noindex">
</head>
<body style="background:#0a0a1a;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Redirecting to article…</p>
    <script src="articles-data.js"></script>
    <script>
        const id = new URLSearchParams(location.search).get('id');
        const article = (window.ARTICLES || []).find(a => a.id === id);
        if (article) {
            const d = new Date(article.date);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const slug = article.slug || article.id;
            location.replace(`/news/${y}/${m}/${day}/${slug}.html`);
        } else {
            location.replace('/news.html');
        }
    </script>
</body>
</html>
