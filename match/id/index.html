<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KabaddiOne - Live Match Broadcast</title>
    <style>
        :root {
            --bg-dark: #0a0a1a;
            --card-bg: #1a1a2e;
            --text-light: #ffffff;
            --text-muted: #b0b0c8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-dark); color: var(--text-light); -webkit-font-smoothing: antialiased; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        /* Top Header */
        .header { text-align: center; margin-bottom: 30px; padding-top: 20px; }
        .match-id-badge { display: inline-block; background: rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; letter-spacing: 1px; margin-bottom: 15px; color: #FF5E3A; border: 1px solid rgba(255,94,58,0.3); }
        
        /* The Clocks */
        .clock-panel { background: var(--card-bg); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
        .main-clock { font-size: 48px; font-weight: 900; letter-spacing: 2px; }
        .raid-clock { font-size: 24px; color: #F0C040; font-weight: bold; margin-top: 5px; }
        .half-indicator { display: inline-block; background: #6A1B9A; padding: 4px 12px; border-radius: 6px; font-size: 14px; font-weight: bold; margin-bottom: 10px; }
        
        /* Main Scoreboard */
        .scoreboard { display: flex; border-radius: 20px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .team-panel { flex: 1; padding: 40px 20px; text-align: center; position: relative; transition: background 0.3s ease; }
        .team-name { font-size: 28px; font-weight: 800; margin-bottom: 15px; line-height: 1.2; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .score { font-size: 96px; font-weight: 900; line-height: 1; text-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        
        .vs-divider { width: 60px; background: #111; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 24px; color: #555; z-index: 10; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        /* Detailed Stats Grid */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .stats-card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .stats-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; }
        .stats-row:last-child { margin-bottom: 0; }
        .stat-label { color: var(--text-muted); font-weight: 600; }
        .stat-val { font-weight: bold; }
        
        /* Match Logs */
        .logs-container { background: var(--card-bg); border-radius: 16px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .logs-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .log-list { max-height: 400px; overflow-y: auto; padding-right: 10px; }
        .log-item { display: flex; gap: 15px; margin-bottom: 20px; }
        .log-time { flex-shrink: 0; font-weight: bold; color: var(--text-muted); font-size: 14px; width: 85px; }
        .log-content { flex: 1; background: rgba(0,0,0,0.2); padding: 12px 16px; border-radius: 12px; border-left: 4px solid #555; }
        .log-title { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
        .log-desc { color: var(--text-muted); font-size: 14px; line-height: 1.4; }
        .log-score { display: inline-block; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-top: 8px; font-weight: bold; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        @media (max-width: 600px) {
            .score { font-size: 64px; }
            .team-name { font-size: 20px; }
            .team-panel { padding: 30px 10px; }
            .vs-divider { width: 40px; font-size: 18px; }
            .stats-grid { grid-template-columns: 1fr; }
            .log-item { flex-direction: column; gap: 5px; }
            .log-time { width: auto; }
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="match-id-badge" id="matchStatus">Connecting to LIVE feed... 🔴</div>
        </div>

        <div class="clock-panel">
            <div class="half-indicator" id="halfIndicator">1st Half</div>
            <div class="main-clock" id="mainClock">--:--</div>
            <div class="raid-clock">Raid: <span id="raidClock">--</span></div>
        </div>

        <div class="scoreboard">
            <div class="team-panel" id="leftPanel" style="background: #228B22;">
                <div class="team-name" id="leftName">Left Team</div>
                <div class="score" id="leftScore">0</div>
            </div>
            <div class="vs-divider">VS</div>
            <div class="team-panel" id="rightPanel" style="background: #1976D2;">
                <div class="team-name" id="rightName">Right Team</div>
                <div class="score" id="rightScore">0</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stats-card">
                <h3 style="margin-bottom: 15px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px;">Left Team Stats</h3>
                <div class="stats-row"><span class="stat-label">Raid Points</span> <span class="stat-val" id="lRaid">0</span></div>
                <div class="stats-row"><span class="stat-label">Tackle Points</span> <span class="stat-val" id="lTackle">0</span></div>
                <div class="stats-row"><span class="stat-label">All Out Points</span> <span class="stat-val" id="lAllOut">0</span></div>
                <div class="stats-row"><span class="stat-label">Extra Points</span> <span class="stat-val" id="lExtra">0</span></div>
            </div>
            <div class="stats-card">
                <h3 style="margin-bottom: 15px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px;">Right Team Stats</h3>
                <div class="stats-row"><span class="stat-label">Raid Points</span> <span class="stat-val" id="rRaid">0</span></div>
                <div class="stats-row"><span class="stat-label">Tackle Points</span> <span class="stat-val" id="rTackle">0</span></div>
                <div class="stats-row"><span class="stat-label">All Out Points</span> <span class="stat-val" id="rAllOut">0</span></div>
                <div class="stats-row"><span class="stat-label">Extra Points</span> <span class="stat-val" id="rExtra">0</span></div>
            </div>
        </div>

        <div class="logs-container">
            <div class="logs-title">Match Timeline</div>
            <div class="log-list" id="timelineLogs">
                Waiting for match events...
            </div>
        </div>
    </div>

    <script>
        // 1. Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBciKNutpVo_zYXCLuVOIUb4VmoPaE7zHM",
            authDomain: "kabaddi-scoreboard.firebaseapp.com",
            databaseURL: "https://kabaddi-scoreboard-e1522-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kabaddi-scoreboard-e1522"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. Extract Match ID
        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('match');

        if (!matchId) {
            document.getElementById('matchStatus').innerText = "Invalid Match ID";
            document.getElementById('matchStatus').style.borderColor = "red";
            document.getElementById('matchStatus').style.color = "red";
        } else {
            document.getElementById('matchStatus').innerText = "LIVE ID: " + matchId + " 🔴";

            // 3. LISTEN TO FIREBASE REALTIME UPDATES
            db.ref('live_matches/' + matchId).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    // Update Clocks
                    if(data.main_clock) document.getElementById('mainClock').innerText = data.main_clock;
                    if(data.raid_clock) document.getElementById('raidClock').innerText = data.raid_clock;
                    
                    // Update Top-Level UI Config
                    if(data.half_status) document.getElementById('halfIndicator').innerText = data.half_status;
                    
                    if(data.left_name) document.getElementById('leftName').innerText = data.left_name;
                    if(data.right_name) document.getElementById('rightName').innerText = data.right_name;
                    if(data.left_score !== undefined) document.getElementById('leftScore').innerText = data.left_score;
                    if(data.right_score !== undefined) document.getElementById('rightScore').innerText = data.right_score;

                    // Dynamically apply Android Team Colors to Web Backgrounds!
                    if(data.left_color) document.getElementById('leftPanel').style.background = data.left_color;
                    if(data.right_color) document.getElementById('rightPanel').style.background = data.right_color;

                    // 4. DECODE JSON SNAPSHOT for Deep Stats & Logs
                    if(data.state_json) {
                        try {
                            const state = JSON.parse(data.state_json);
                            
                            // Map deep stats using the non-minified keys established by @Keep
                            document.getElementById('lRaid').innerText = state.leftRaidPoints || 0;
                            document.getElementById('lTackle').innerText = state.leftTacklePoints || 0;
                            document.getElementById('lAllOut').innerText = state.leftAllOutPoints || 0;
                            document.getElementById('lExtra').innerText = state.leftExtraPoints || 0;

                            document.getElementById('rRaid').innerText = state.rightRaidPoints || 0;
                            document.getElementById('rTackle').innerText = state.rightTacklePoints || 0;
                            document.getElementById('rAllOut').innerText = state.rightAllOutPoints || 0;
                            document.getElementById('rExtra').innerText = state.rightExtraPoints || 0;

                            // Decode and Render Timeline Logs
                            if (state.logsJson) {
                                const logs = JSON.parse(state.logsJson);
                                let logHtml = "";
                                
                                // Reverse loop to show newest events at the top
                                for(let i = logs.length - 1; i >= 0; i--) {
                                    const log = logs[i];
                                    
                                    // Determine border color based on team
                                    let borderColor = "#555"; 
                                    if (log.isLeftTeam === true) borderColor = data.left_color || "#228B22";
                                    else if (log.isLeftTeam === false) borderColor = data.right_color || "#1976D2";

                                    let scoreBadge = log.scoreStr ? `<div class="log-score">${log.scoreStr}</div>` : "";

                                    logHtml += `
                                    <div class="log-item">
                                        <div class="log-time">${log.timeStr}</div>
                                        <div class="log-content" style="border-left-color: ${borderColor};">
                                            <div class="log-title">${log.title}</div>
                                            <div class="log-desc">${log.desc}</div>
                                            ${scoreBadge}
                                        </div>
                                    </div>`;
                                }
                                document.getElementById('timelineLogs').innerHTML = logHtml || "No events recorded yet.";
                            }
                        } catch(e) {
                            console.error("Failed to parse JSON state", e);
                        }
                    }
                } else {
                    document.getElementById('matchStatus').innerText = "Match Offline or Ended";
                }
            });
        }
    </script>
</body>
</html>
