---
layout: default
---
<style>
    .article-header { text-align: center; padding: 40px 0; border-bottom: 1px solid var(--border-subtle); margin-bottom: 40px; }
    .article-header h1 { font-family: var(--font-heading); font-size: 3rem; color: #fff; line-height: 1.2; margin: 20px 0; }
    .article-meta { color: var(--text-muted); font-size: 0.9rem; display: flex; justify-content: center; gap: 20px; }
    .article-image { width: 100%; max-height: 500px; object-fit: cover; border-radius: var(--radius-lg); margin-bottom: 40px; }
    
    .article-content { font-size: 1.1rem; line-height: 1.8; color: #d1d1e0; max-width: 800px; margin: 0 auto; }
    .article-content h2, .article-content h3 { font-family: var(--font-heading); color: #fff; margin: 40px 0 15px; }
    .article-content p { margin-bottom: 20px; }
    .article-content a { color: var(--neon-cyan); text-decoration: none; border-bottom: 1px solid var(--neon-cyan); }
    .article-content img { max-width: 100%; border-radius: 10px; margin: 20px 0; }
    .article-content ul, .article-content ol { margin: 20px 0 20px 30px; }
</style>

<article>
    <header class="article-header">
        <span class="tag-badge">{{ page.category | default: "News" }}</span>
        <h1>{{ page.title }}</h1>
        <div class="article-meta">
            <span><i class="fa-regular fa-calendar"></i> {{ page.date | date: "%B %d, %Y" }}</span>
            <span><i class="fa-regular fa-user"></i> {{ page.author | default: "KabaddiOne Team" }}</span>
        </div>
    </header>

    {% if page.image %}
    <img src="{{ page.image }}" alt="{{ page.title }}" class="article-image">
    {% endif %}

    <div class="article-content">
        {{ content }}
    </div>
</article>

<div style="text-align: center; margin-top: 60px;">
    <a href="/blog/" class="nav-cta-btn" style="text-decoration:none; padding: 15px 30px; font-size: 1rem;"><i class="fa-solid fa-arrow-left"></i> Back to All Articles</a>
</div>
