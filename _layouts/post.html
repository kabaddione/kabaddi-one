---
layout: default
---
<style>
    .article-header { text-align: center; padding: 40px 0; max-width: 900px; margin: 0 auto; }
    .article-header h1 { font-family: var(--font-heading); font-size: clamp(2rem, 4vw, 3rem); color: #fff; line-height: 1.2; margin: 20px 0; }
    .article-hero { width: 100%; max-height: 500px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 40px; }
    
    /* Reading optimized text styles */
    .article-body { max-width: 800px; margin: 0 auto; font-family: 'Inter', sans-serif; font-size: 1.1rem; line-height: 1.8; color: #d1d1e0; }
    .article-body h2, .article-body h3 { font-family: var(--font-heading); color: #fff; margin: 40px 0 15px; }
    .article-body p { margin-bottom: 20px; }
    .article-body a { color: var(--neon-cyan); text-decoration: none; border-bottom: 1px solid var(--neon-cyan); }
    .article-body img { max-width: 100%; border-radius: 10px; margin: 20px 0; }
    .article-body ul, .article-body ol { margin: 20px 0 20px 30px; }
    .article-body blockquote { border-left: 4px solid var(--accent); padding-left: 20px; margin: 20px 0; font-style: italic; color: #a0a0b8; }
</style>

<article style="max-width: var(--max-width); margin: 0 auto; padding: 0 24px;">
    <header class="article-header">
        <span class="tag-badge">{{ page.category | default: "News" }}</span>
        <h1>{{ page.title }}</h1>
        <div class="meta-info" style="justify-content: center; margin-top: 15px;">
            <span><i class="fa-regular fa-calendar"></i> {{ page.date | date: "%B %d, %Y" }}</span>
            <span><i class="fa-regular fa-user"></i> {{ page.author | default: "KabaddiOne Team" }}</span>
        </div>
    </header>

    {% if page.image %}
    <img src="{{ page.image }}" alt="{{ page.title }}" class="article-hero">
    {% endif %}

    <div class="article-body">
        {{ content }}
    </div>
</article>

<div style="text-align: center; margin: 60px 0;">
    <a href="/news.html" class="nav-cta-btn" style="text-decoration:none; padding: 12px 24px; font-size: 1rem;"><i class="fa-solid fa-arrow-left"></i> Back to All News</a>
</div>
