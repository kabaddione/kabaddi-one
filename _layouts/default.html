<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>{{ page.title | default: "KabaddiOne News" }}</title>
    <meta name="description" content="{{ page.description | default: 'Latest Kabaddi news, analysis, and tutorials.' }}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- SHARED THEME CSS (From your overlay.html) --- */
        :root {
            --bg-primary: #0a0a1a; --bg-secondary: #0f0f24; --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1); --neon-green: #39FF14; --neon-cyan: #00FFFF;
            --neon-gradient: linear-gradient(to right, #39FF14, #00FFFF); --accent: #FF5E3A;
            --accent-secondary: #FFB830; --text-primary: #ffffff; --text-secondary: #b0b0c8;
            --text-muted: #7a7a95; --border-subtle: rgba(255, 255, 255, 0.08);
            --radius-sm: 12px; --radius-md: 20px; --radius-lg: 28px;
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --font-heading: 'Oswald', 'Segoe UI', system-ui, sans-serif; 
            --font-body: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --max-width: 1400px; --nav-height: 72px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-body); background-color: var(--bg-primary); color: var(--text-primary); line-height: 1.6; overflow-x: hidden; min-height: 100vh; }
        
        /* Nav */
        .nav { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; height: var(--nav-height); transition: var(--transition-smooth); background: rgba(10, 10, 26, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-subtle); }
        .nav-inner { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 100%; }
        .nav-logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-heading); font-weight: 800; font-size: 1.5rem; color: #fff; text-decoration: none; letter-spacing: -0.5px; }
        .nav-logo img { width: 38px; height: 38px; object-fit: contain; }
        .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; }
        .nav-links a { color: #fff; text-decoration: none; font-weight: 500; font-size: 0.9rem; position: relative; }
        .nav-links a.nav-active { color: var(--neon-cyan); }
        .nav-cta-btn { background: var(--neon-gradient); color: #3A004A !important; padding: 10px 22px; border-radius: 50px; font-weight: 700 !important; }

        /* Footer */
        .footer { background: var(--bg-secondary); border-top: 1px solid var(--border-subtle); padding: 40px 24px 24px; margin-top: 60px; }
        .footer-inner { max-width: var(--max-width); margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 20px; }
        .footer-logo { display: flex; align-items: center; gap: 8px; font-family: var(--font-heading); font-weight: 800; color: #fff; }
        .footer-logo img { width: 38px; }
        .footer-links { display: flex; gap: 20px; flex-wrap: wrap; }
        .footer-links a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
        .social-links { display: flex; gap: 16px; }
        .social-links a { color: var(--text-muted); font-size: 1.2rem; }
        .footer-copy { color: var(--text-muted); font-size: 0.8rem; text-align: center; width: 100%; margin-top: 16px; }
        
        /* Shared Helpers */
        .tag-badge { display: inline-block; background: rgba(0, 255, 255, 0.15); color: var(--neon-cyan); padding: 4px 12px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .meta-info { display: flex; align-items: center; gap: 12px; font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <nav class="nav">
        <div class="nav-inner">
            <a href="/index.html" class="nav-logo">
                <img src="/images/kabaddione_logo.png" alt="KabaddiOne">
                <span>KabaddiOne</span>
            </a>
            <ul class="nav-links">
                <li><a href="/#features">Features</a></li>
                <li><a href="/matches.html">Live Score</a></li>
                <li><a href="/overlay.html">Overlay</a></li>
                <li><a href="/news.html" class="nav-active">News</a></li>
                <li><a href="/#pro">KabaddiOne Pro</a></li>
                <li><a href="/download.html" class="nav-cta-btn">Download</a></li>
            </ul>
        </div>
    </nav>

    <main style="padding-top: calc(var(--nav-height) + 40px); min-height: 80vh;">
        {{ content }}
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-logo">
                <img src="/images/kabaddione_logo.png" alt="KabaddiOne">
                <span>KabaddiOne</span>
            </div>
            <div class="footer-links">
                <a href="/#features">Features</a>
                <a href="/matches.html">Live Score</a>
                <a href="/overlay.html">Overlay</a>
                <a href="/about.html">About Us</a>
                <a href="/privacy.html">Privacy Policy</a>
                <a href="/contact.html">Contact Us</a>
            </div>
            <div class="social-links">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
            </div>
            <p class="footer-copy">© 2026 KabaddiOne. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
